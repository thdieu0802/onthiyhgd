
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ôn Thi">
<meta name="theme-color" content="#16a085">
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Thi Y Học Gia Đình</title>
    <style>
        :root {
            --primary: #16a085;
            --secondary: #2c3e50;
            --success: #27ae60;
            --info: #f39c12;
            --bg: #ecf0f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            
            /* CHẶN BÔI ĐEN COPY THEO YÊU CẦU */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px;}
        .progress-bar {
            height: 10px;
            background: #bdc3c7;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }
        .question-section { flex-grow: 1; }
        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--secondary);
            line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
            font-size: 1.05rem;
            background-color: #fff;
        }
        .option:hover { background: #f0f0f0; }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        /* PHẦN GIẢI THÍCH */
        #explanation-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff8e1;
            border-left: 5px solid var(--info);
            border-radius: 5px;
            font-size: 1rem;
            color: #b9770e;
            line-height: 1.5;
            animation: fadeIn 0.5s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .footer-nav {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background: #1a252f; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #score-display { font-weight: bold; color: var(--primary); font-size: 1.1rem;}
        #result-screen { display: none; text-align: center; flex-grow: 1; }
        
        .jump-container { margin-top: 15px; text-align: center; font-weight: bold;}
        .jump-container select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; width: 60%;}
        
        .creator-badge {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px dashed #ecf0f1;
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="quiz-screen">
            <header>
                <h1>ÔN THI Y HỌC GIA ĐÌNH</h1>
            </header>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="footer-nav">
                <span id="question-count" style="font-weight: bold; color: #555;">Câu 1 / --</span>
                <span id="score-display">Đúng: 0</span>
            </div>
            
            <div class="jump-container">
                <select id="jump-select" onchange="jumpToQuestion()"></select>
            </div>
            <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">
            
            <div class="question-section">
                <div id="q-text" class="question-text">Đang tải...</div>
                <div id="options-list" class="options"></div>
                <!-- Div hiển thị giải thích -->
                <div id="explanation-box"></div>
            </div>
            <div class="footer-nav" style="justify-content: center; margin-top: 30px;">
                <button id="next-btn" onclick="nextQuestion()" disabled style="width: 100%;">Câu tiếp theo &rarr;</button>
            </div>
        </div>

        <div id="result-screen">
            <h2 style="color: var(--primary); margin-top: 40px;">Hoàn Thành Bài Thi!</h2>
            <div style="font-size: 4rem; margin: 20px 0; color: var(--success); font-weight: 800;" id="final-result"></div>
            <p id="feedback" style="font-size: 1.2rem; color: #555; margin-bottom: 30px;"></p>
            <button onclick="location.reload()" style="background: var(--primary); width: 100%; padding: 15px;">Làm lại từ đầu</button>
        </div>
        
        <div class="creator-badge">
            © @THDieu
        </div>
    </div>

    <script>
        // CHẶN CHUỘT PHẢI VÀ PHÍM TẮT COPY
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        const quizData = [{"q": "Câu 1: Bệnh án Y học gia đình (YHGĐ) khác biệt cơ bản với bệnh án chuyên khoa ở điểm nào?", "a": ["A. Chỉ quan tâm đến triệu chứng cấp tính hiện tại", "B. Tính liên tục, toàn diện và theo dõi suốt đời bệnh nhân trong bối cảnh gia đình", "C. Bỏ qua các yếu tố tâm lý xã hội", "D. Chỉ lưu trữ trong thời gian nằm viện"], "c": 1, "e": "Bệnh án YHGĐ lưu trữ thông tin sức khỏe xuyên suốt cuộc đời người bệnh, lấy bệnh nhân làm trung tâm thay vì chỉ tập trung vào một đợt bệnh."}, {"q": "Câu 2: Theo nguyên tắc SOAP trong hồ sơ bệnh án, chữ \"S\" (Subjective) đại diện cho phần thông tin nào?", "a": ["A. Khám lâm sàng", "B. Xét nghiệm cận lâm sàng", "C. Thông tin chủ quan do bệnh nhân hoặc người nhà khai báo (triệu chứng cơ năng)", "D. Kế hoạch điều trị"], "c": 2, "e": "\"Subjective\" bao gồm lý do đến khám, bệnh sử và các lời than phiền do chính bệnh nhân kể lại."}, {"q": "Câu 3: Chữ \"O\" (Objective) trong hồ sơ SOAP bao gồm những thông tin nào?", "a": ["A. Tiền sử gia đình", "B. Triệu chứng cơ năng", "C. Dấu hiệu sinh tồn, khám thực thể lâm sàng và kết quả cận lâm sàng", "D. Lời khuyên của bác sĩ"], "c": 2, "e": "\"Objective\" là các dấu hiệu khách quan mà bác sĩ có thể đo lường, nhìn thấy và kiểm chứng được."}, {"q": "Câu 4: Chữ \"A\" (Assessment) trong cấu trúc SOAP có ý nghĩa gì?", "a": ["A. Yêu cầu bệnh nhân tái khám", "B. Chẩn đoán hoặc đánh giá vấn đề sức khỏe dựa trên việc tổng hợp S và O", "C. Đơn thuốc", "D. Khám các cơ quan"], "c": 1, "e": "Đây là phần bác sĩ đưa ra nhận định, chẩn đoán xác định hoặc đánh giá mức độ kiểm soát của bệnh lý."}, {"q": "Câu 5: Chữ \"P\" (Plan) trong hồ sơ SOAP bao gồm những bước nào?", "a": ["A. Chỉ kê đơn thuốc", "B. Kế hoạch xét nghiệm, điều trị, tư vấn giáo dục sức khỏe và hẹn tái khám", "C. Hỏi tiền sử bệnh", "D. Đo sinh hiệu"], "c": 1, "e": "\"Plan\" bao hàm toàn bộ chiến lược quản lý bệnh nhân toàn diện sau khi đã có đánh giá chẩn đoán."}, {"q": "Câu 6: Cây gia hệ (Genogram) trong hồ sơ YHGĐ nên được vẽ tối thiểu bao nhiêu thế hệ?", "a": ["A. 1 thế hệ", "B. 2 thế hệ", "C. 3 thế hệ", "D. 4 thế hệ"], "c": 2, "e": "Genogram 3 thế hệ (ông bà, cha mẹ, con cái) là tiêu chuẩn để nhìn nhận rõ các mô hình bệnh di truyền và cấu trúc gia đình."}, {"q": "Câu 7: Biểu đồ sinh thái (Ecomap) có mục đích chính là gì?", "a": ["A. Vẽ sơ đồ cấu trúc gene của bệnh nhân", "B. Thể hiện các mối quan hệ xã hội, sự tương tác và mạng lưới hỗ trợ xung quanh bệnh nhân/gia đình", "C. Liệt kê các loại thuốc bệnh nhân đang dùng", "D. Vẽ sơ đồ nhà ở của bệnh nhân"], "c": 1, "e": "Ecomap giúp bác sĩ đánh giá các nguồn lực xã hội, áp lực từ công việc, bạn bè, y tế cộng đồng tác động lên bệnh nhân."}, {"q": "Câu 8: Hồ sơ bệnh án YHGĐ cho đối tượng Trẻ em cần nhấn mạnh thêm thông tin đặc thù nào?", "a": ["A. Lịch sử làm việc, nghề nghiệp", "B. Lịch tiêm chủng, biểu đồ tăng trưởng và mốc phát triển tâm thần vận động", "C. Đánh giá sa sút trí tuệ", "D. Nguy cơ té ngã do loãng xương"], "c": 1, "e": "Dự phòng, tiêm chủng và theo dõi phát triển thể chất/tâm thần là trọng tâm cốt lõi trong quản lý sức khỏe trẻ em."}, {"q": "Câu 9: Hồ sơ bệnh án YHGĐ cho Phụ nữ mang thai cần có thêm biểu mẫu nào?", "a": ["A. Biểu đồ theo dõi đường huyết liên tục", "B. Biểu đồ tăng trưởng BMI trẻ em", "C. Sổ khám thai, theo dõi tuổi thai, dự kiến sinh và các xét nghiệm tầm soát thai kỳ", "D. Thang điểm đánh giá ung thư tuyến tiền liệt"], "c": 2, "e": "Quản lý thai kỳ cần theo dõi sát sự phát triển của thai nhi và phòng ngừa các biến chứng sản khoa."}, {"q": "Câu 10: Khi ghi chép toa thuốc, tên thuốc nên được ưu tiên ghi theo chuẩn nào?", "a": ["A. Tên viết tắt của phòng khám", "B. Tên chung quốc tế (INN) kèm theo tên biệt dược nếu cần", "C. Tên tiếng Việt tự dịch", "D. Chỉ ghi hàm lượng"], "c": 1, "e": "Kê toa theo tên INN giúp minh bạch, tránh nhầm lẫn thuốc và tuân thủ đúng quy định pháp luật."}, {"q": "Câu 11: Trong toa thuốc cho bệnh mạn tính, thời gian sử dụng thuốc tối đa thường được kê là bao nhiêu ngày theo quy định BHYT thông thường?", "a": ["A. 3 ngày", "B. 7 ngày", "C. 30 ngày", "D. 6 tháng"], "c": 2, "e": "Bệnh mạn tính thường được cấp thuốc chu kỳ 1 tháng (30 ngày) để bệnh nhân tái khám và bác sĩ đánh giá lại hiệu quả."}, {"q": "Câu 12: Việc lưu trữ hồ sơ bệnh án YHGĐ cần đảm bảo yếu tố quan trọng nào nhất về mặt đạo đức?", "a": ["A. Phải công khai cho mọi người", "B. Đảm bảo tính bảo mật tuyệt đối thông tin của bệnh nhân và gia đình", "C. Bán thông tin cho các công ty dược", "D. Xóa ngay sau khi khám xong"], "c": 1, "e": "Hồ sơ YHGĐ chứa rất nhiều thông tin nhạy cảm về đời tư, di truyền, mâu thuẫn gia đình nên bảo mật là nguyên tắc tối thượng."}, {"q": "Câu 13: Bệnh án điện tử (EMR) mang lại lợi ích gì nổi bật cho phòng khám YHGĐ?", "a": ["A. Bác sĩ không cần khám bệnh trực tiếp", "B. Chia sẻ, lưu trữ, trích xuất dữ liệu dọc (theo thời gian) nhanh chóng và cảnh báo tương tác thuốc", "C. Bệnh nhân tự kê đơn thuốc", "D. Tự động chữa khỏi bệnh"], "c": 1, "e": "EMR giúp hệ thống hóa khối lượng thông tin khổng lồ suốt đời của người bệnh, hỗ trợ quyết định lâm sàng rất tốt."}, {"q": "Câu 14: Thành phần nào sau đây là yêu cầu bắt buộc phải có tính pháp lý trong toa thuốc?", "a": ["A. Số điện thoại của bệnh nhân", "B. Sở thích ăn uống của bệnh nhân", "C. Chữ ký và họ tên (hoặc mộc) của bác sĩ điều trị", "D. Giá tiền của thuốc"], "c": 2, "e": "Chữ ký xác nhận trách nhiệm chuyên môn và pháp lý của người kê đơn thuốc."}, {"q": "Câu 15: Trong nguyên tắc ghi chép hồ sơ, tiêu chí \"Tính chính xác\" đòi hỏi điều gì?", "a": ["A. Ghi chép dài dòng văn tự", "B. Ghi bằng ngôn ngữ ẩn dụ", "C. Định danh đúng bệnh nhân, thông tin rõ ràng, khách quan, không tẩy xóa tùy tiện", "D. Ghi trước các triệu chứng dù chưa khám"], "c": 2, "e": "Hồ sơ là tài liệu pháp lý, mọi thông tin phải trung thực, rõ ràng và đúng người đúng bệnh."}, {"q": "Câu 16: Tại sao Y Học Gia Đình lại ưu tiên sử dụng phân loại quốc tế ICPC-2 (International Classification of Primary Care) bên cạnh ICD-10?", "a": ["A. Vì ICPC-2 dùng cho y học cổ truyền", "B. Vì ICPC-2 cho phép mã hóa cả \"Lý do đến khám\" (triệu chứng, lo âu) và các can thiệp chăm sóc ban đầu, không chỉ mã hóa bệnh tật", "C. Vì ICD-10 đã bị bãi bỏ", "D. Vì ICPC-2 dễ học hơn"], "c": 1, "e": "Ở tuyến ban đầu, bệnh nhân thường đến vì triệu chứng mơ hồ (mệt, lo sợ) chưa đủ tiêu chuẩn chẩn đoán bệnh theo ICD-10."}, {"q": "Câu 17: Phần \"Bệnh sử\" (History of present illness) nằm ở mục nào trong cấu trúc SOAP?", "a": ["A. S (Subjective)", "B. O (Objective)", "C. A (Assessment)", "D. P (Plan)"], "c": 0, "e": "Bệnh sử là câu chuyện diễn tiến của triệu chứng do bệnh nhân kể lại, thuộc về thông tin chủ quan."}, {"q": "Câu 18: Khi vẽ Genogram, biểu tượng hình vuông và hình tròn tương ứng với giới tính nào?", "a": ["A. Vuông: Nữ, Tròn: Nam", "B. Vuông: Nam, Tròn: Nữ", "C. Vuông: Bệnh nhân, Tròn: Người nhà", "D. Không có quy định"], "c": 1, "e": "Đây là quy ước quốc tế chuẩn khi vẽ cây phả hệ."}, {"q": "Câu 19: Bệnh án YHGĐ sử dụng phương pháp \"Quản lý theo vấn đề\" (Problem-Oriented Medical Record - POMR), ưu điểm của phương pháp này là gì?", "a": ["A. Chỉ liệt kê các bệnh đã khỏi", "B. Giúp bác sĩ theo dõi riêng biệt diễn tiến của từng vấn đề sức khỏe (cấp tính, mạn tính, tâm lý) theo thời gian một cách logic", "C. Gộp chung mọi bệnh thành một chẩn đoán", "D. Giảm bớt số lượng thuốc phải kê"], "c": 1, "e": "Lập danh sách vấn đề (Problem List) giúp bác sĩ không bỏ sót các bệnh đồng mắc và theo dõi chúng xuyên suốt."}, {"q": "Câu 20: Nếu bệnh nhân đến khám vì \"Mất ngủ, hay khóc, buồn bã sau khi con đi lấy chồng\", thông tin này nên được chú trọng ghi nhận ở phần nào của công cụ YHGĐ?", "a": ["A. Sinh hiệu", "B. Cây gia hệ và vòng đời gia đình (Family life cycle)", "C. Khám phổi", "D. Kế hoạch xét nghiệm máu"], "c": 1, "e": "Triệu chứng này liên quan trực tiếp đến cuộc khủng hoảng tâm lý khi bước sang giai đoạn \"Tổ ấm rỗng\" trong vòng đời gia đình."}, {"q": "Câu 21: Trong phần \"Plan\", việc \"Tư vấn giáo dục sức khỏe\" (Patient education) có vai trò gì?", "a": ["A. Là thủ tục phụ, không quan trọng", "B. Tăng tính tuân thủ điều trị, giúp bệnh nhân tự quản lý bệnh mạn tính (như tiểu đường, THA)", "C. Để thu thêm viện phí", "D. Chuyển trách nhiệm cho bệnh nhân"], "c": 1, "e": "Bệnh nhân hiểu về bệnh và cách dùng thuốc sẽ hợp tác tốt hơn, đây là yếu tố then chốt của y học phòng ngừa."}, {"q": "Câu 22: Việc ghi nhận \"Tiền sử dị ứng thuốc\" phải được đặt ở vị trí nào trong bệnh án/toa thuốc?", "a": ["A. Ở trang cuối cùng", "B. Vị trí nổi bật, dễ thấy nhất ngay trang bìa hoặc đầu toa thuốc để cảnh báo", "C. Trong phần khám tiêu hóa", "D. Không cần ghi nếu bệnh nhân không hỏi"], "c": 1, "e": "Dị ứng thuốc (nhất là sốc phản vệ) đe dọa tính mạng, cần được highlight đỏ để tất cả nhân viên y tế đều thấy."}, {"q": "Câu 23: Cấu trúc toa thuốc hoàn chỉnh cần ghi rõ \"Cách sử dụng\" cho từng loại thuốc. Thông tin nào sau đây là MỘT VÍ DỤ đúng chuẩn?", "a": ["A. \"Uống khi nào mệt\"", "B. \"Uống 1 viên sau ăn sáng, duy trì hàng ngày\"", "C. \"Dùng như bác sĩ dặn\"", "D. \"Uống nhiều nước\""], "c": 1, "e": "Lời dặn phải rõ ràng về liều lượng, thời điểm trong ngày và mối quan hệ với bữa ăn để bệnh nhân không bị nhầm."}, {"q": "Câu 24: Công cụ \"Chỉ số APGAR gia đình\" dùng để đánh giá điều gì?", "a": ["A. Chỉ số suy hô hấp của trẻ sơ sinh", "B. Mức độ hài lòng của các thành viên về chức năng hỗ trợ và gắn kết của gia đình", "C. Chỉ số khối cơ thể", "D. Mức độ ô nhiễm nhà ở"], "c": 1, "e": "Khác với Apgar sơ sinh, Family APGAR đánh giá 5 yếu tố: Thích ứng, Hợp tác, Tăng trưởng, Tình cảm và Giải quyết vấn đề."}, {"q": "Câu 25: Hồ sơ theo dõi dọc (Longitudinal record) mang lại giá trị lâm sàng nào cao nhất?", "a": ["A. Tốn ít giấy mực", "B. Giúp phát hiện các thay đổi nhỏ về sinh hiệu/xét nghiệm theo thời gian (trend) sớm hơn việc chỉ xem kết quả cắt ngang", "C. Bệnh nhân không cần tái khám", "D. Che giấu được sai sót cũ"], "c": 1, "e": "Nhìn vào biểu đồ đường huyết hay huyết áp qua nhiều năm giúp bác sĩ đánh giá chính xác quỹ đạo bệnh tật."}, {"q": "Câu 26: Trong bệnh án, \"Danh sách các loại thuốc đang dùng\" (Medication list) cần bao gồm cả những loại nào ngoài thuốc kê toa?", "a": ["A. Chỉ ghi thuốc do mình kê", "B. Thuốc không kê toa (OTC), thực phẩm chức năng, và thuốc đông y/thảo dược", "C. Chỉ ghi thuốc đắt tiền", "D. Chỉ ghi thuốc tiêm"], "c": 1, "e": "Rất nhiều thảo dược và thực phẩm chức năng tương tác mạnh với thuốc tây (ví dụ: Ginkgo biloba gây chảy máu)."}, {"q": "Câu 27: Một bệnh nhân bị đái tháo đường, khi lập \"Danh sách vấn đề\" (Problem list), cần chia làm 2 loại là gì?", "a": ["A. Bệnh nhẹ và bệnh nặng", "B. Vấn đề đang hoạt động (Active) và Vấn đề đã giải quyết/Tiền sử (Inactive/Resolved)", "C. Vấn đề của nam và nữ", "D. Vấn đề nội khoa và ngoại khoa"], "c": 1, "e": "Giúp bác sĩ tập trung ngay vào các bệnh đang cần can thiệp (Active) mà không bị nhiễu bởi các bệnh đã khỏi."}, {"q": "Câu 28: Khi chuyển tuyến (Referral), Tóm tắt bệnh án (Discharge/Referral summary) cần cung cấp thông tin gì quan trọng nhất cho bác sĩ tuyến trên?", "a": ["A. Toàn bộ nhật ký bệnh án từ lúc sinh ra", "B. Lý do chuyển tuyến, tóm tắt bệnh sử, các xét nghiệm đã làm và các thuốc ĐANG SỬ DỤNG", "C. Sở thích cá nhân", "D. Hóa đơn viện phí"], "c": 1, "e": "Cung cấp thông tin súc tích, đúng trọng tâm giúp tuyến trên tiếp nhận nhanh và không phải làm lại các xét nghiệm thừa."}, {"q": "Câu 29: Nếu bệnh án là bản giấy, khi viết sai thông tin thì bác sĩ nên sửa chữa bằng cách nào theo chuẩn pháp lý?", "a": ["A. Dùng bút xóa trắng bôi đi viết lại", "B. Xé trang đó viết trang mới", "C. Gạch ngang một đường qua chữ sai (vẫn đọc được chữ cũ), viết chữ đúng lên trên và ký nháy bên cạnh", "D. Viết đè lên chữ cũ"], "c": 2, "e": "Nguyên tắc pháp lý không cho phép che giấu thông tin đã viết, gạch ngang giúp minh bạch quá trình sửa đổi."}, {"q": "Câu 30: Chăm sóc phòng ngừa (Preventive care flow sheet) trong hồ sơ YHGĐ thường theo dõi các hạng mục nào?", "a": ["A. Lịch sử phẫu thuật thẩm mỹ", "B. Lịch tầm soát ung thư (Pap smear, Nhũ ảnh), đo mật độ xương, xét nghiệm lipid máu và tiêm ngừa", "C. Lịch đi du lịch", "D. Số lần nằm viện cấp cứu"], "c": 1, "e": "Đây là bảng theo dõi đặc trưng của YHGĐ để nhắc nhở bác sĩ thực hiện dự phòng cấp 1 và cấp 2 đúng thời điểm."}, {"q": "Câu 31: Việc ứng dụng mô hình BPS (Biopsychosocial model) vào hồ sơ bệnh án YHGĐ đòi hỏi bác sĩ phải đánh giá điều gì?", "a": ["A. Chỉ đánh giá các tổn thương sinh học ở mức độ tế bào", "B. Tương tác phức tạp giữa yếu tố Sinh học (bệnh lý), Tâm lý (nhận thức, cảm xúc) và Xã hội (kinh tế, văn hóa) gây ra bệnh", "C. Phân tích gen toàn diện", "D. Chỉ phân tích môi trường nước"], "c": 1, "e": "BPS là triết lý nền tảng của YHGĐ, cho rằng bệnh tật không chỉ do vi khuẩn/virus mà còn do stress và hoàn cảnh sống."}, {"q": "Câu 32: Khái niệm \"ICE\" (Ideas, Concerns, Expectations) thường được bác sĩ YHGĐ khai thác ở phần nào của bệnh án?", "a": ["A. Phần Kế hoạch (P)", "B. Phần Bệnh sử chủ quan (S) - tìm hiểu ý nghĩ, mối quan tâm và mong đợi của bệnh nhân về căn bệnh", "C. Phần Khám thực thể (O)", "D. Phần Toa thuốc"], "c": 1, "e": "Khai thác ICE giúp bác sĩ hiểu rõ bệnh nhân đang lo sợ bị ung thư hay chỉ muốn xin thuốc giảm đau, từ đó tư vấn trúng đích."}, {"q": "Câu 33: Sự khác biệt giữa \"Illness\" và \"Disease\" trong triết lý ghi chép của YHGĐ là gì?", "a": ["A. Là một, không có khác biệt", "B. Disease là chẩn đoán y khoa (sinh học), Illness là trải nghiệm chủ quan và sự chịu đựng của bệnh nhân về căn bệnh đó", "C. Illness là bệnh truyền nhiễm, Disease là bệnh mạn tính", "D. Disease dùng cho trẻ em, Illness dùng cho người già"], "c": 1, "e": "Bác sĩ chuyên khoa chữa \"Disease\" (Căn bệnh), bác sĩ YHGĐ chữa \"Illness\" (Nỗi đau ốm của người bệnh)."}, {"q": "Câu 34: Bác sĩ kê 1 toa thuốc nhưng quên không ghi hàm lượng (ví dụ chỉ ghi Paracetamol 1 viên x 2). Nguy cơ lớn nhất về mặt Dược lâm sàng là gì?", "a": ["A. Bệnh nhân tốn nhiều tiền hơn", "B. Sai lệch liều lượng dẫn đến ngộ độc gan (nếu dùng loại 650mg hoặc 1000mg) hoặc không đủ liều hạ sốt", "C. Dược sĩ không bán được hàng", "D. Không có nguy cơ gì"], "c": 1, "e": "Cùng 1 tên thuốc nhưng có rất nhiều hàm lượng khác nhau, không ghi hàm lượng là lỗi kê toa nghiêm trọng nhất."}, {"q": "Câu 35: Trong việc lập kế hoạch (Plan) cho bệnh nhân Đái tháo đường, khái niệm \"Cùng ra quyết định\" (Shared decision making) được thể hiện ở hồ sơ như thế nào?", "a": ["A. Bác sĩ tự đặt mục tiêu HbA1c và bắt bệnh nhân ký tên", "B. Ghi nhận sự thảo luận giữa bác sĩ và bệnh nhân, thống nhất lựa chọn phác đồ phù hợp với khả năng tài chính và lối sống của bệnh nhân", "C. Giao toàn quyền cho bệnh nhân tự chọn thuốc", "D. Dùng phác đồ rập khuôn cho mọi người"], "c": 1, "e": "Bệnh mạn tính cần sự hợp tác lâu dài, phác đồ tốt nhất là phác đồ mà bệnh nhân đồng ý và có khả năng tuân thủ."}, {"q": "Câu 36: Tại sao trong đánh giá gia đình, biểu tượng đường gạch chéo (//) giữa hai vợ chồng trên Genogram lại có ý nghĩa lâm sàng quan trọng đối với sức khỏe đứa trẻ?", "a": ["A. Ký hiệu này nghĩa là hai người đã ly hôn/ly thân, báo hiệu yếu tố stress tâm lý, nguy cơ trầm cảm hoặc bỏ bê y tế ở đứa trẻ", "B. Ký hiệu này nghĩa là hai người mới kết hôn", "C. Báo hiệu sinh đôi", "D. Ký hiệu di truyền bệnh máu khó đông"], "c": 0, "e": "Sự đổ vỡ gia đình là một rủi ro cực lớn đối với sức khỏe tinh thần và thể chất của trẻ em."}, {"q": "Câu 37: Cảnh báo tương tác thuốc (Drug-drug interaction alert) trên phần mềm EMR đôi khi gây ra hiện tượng \"Alert fatigue\" (Mệt mỏi vì cảnh báo). Giải pháp tốt nhất cho bác sĩ YHGĐ là gì?", "a": ["A. Tắt hoàn toàn hệ thống cảnh báo", "B. Tối ưu hóa phần mềm để chỉ bật các cảnh báo tương tác chống chỉ định nghiêm trọng (Mức độ nặng/nguy hiểm tính mạng)", "C. Không dùng phần mềm nữa", "D. Kê ít thuốc đi để khỏi bị báo"], "c": 1, "e": "Nếu cảnh báo nhảy lên liên tục với cả những tương tác nhẹ, bác sĩ sẽ có xu hướng bấm \"Bỏ qua\" theo thói quen và lỡ mất các cảnh báo chết người."}, {"q": "Câu 38: Khi ghi chép về một \"Triệu chứng âm tính\" (Pertinent negative) trong phần O (Khám lâm sàng), nó mang ý nghĩa gì?", "a": ["A. Bác sĩ quên khám vùng đó", "B. Việc xác nhận sự vắng mặt của một triệu chứng quan trọng (ví dụ: \"Không có dấu cổ gượng\") giúp loại trừ các chẩn đoán nguy hiểm (như viêm màng não)", "C. Bệnh nhân từ chối cho khám", "D. Triệu chứng đó không liên quan"], "c": 1, "e": "Ghi chú những dấu hiệu \"Không có\" giúp chứng minh bác sĩ đã nghĩ đến bệnh cảnh nguy hiểm và đã loại trừ nó."}, {"q": "Câu 39: Đâu là đặc tính của \"Chăm sóc liên tục\" (Continuity of care) được thể hiện qua bệnh án YHGĐ?", "a": ["A. Liên tục về thông tin, liên tục về quản lý và liên tục về mối quan hệ thầy thuốc - bệnh nhân", "B. Chỉ khám liên tục mỗi ngày", "C. Dùng một loại thuốc liên tục cả đời", "D. Bệnh nhân không bao giờ chuyển viện"], "c": 0, "e": "Bệnh án đóng vai trò duy trì sự liên tục về thông tin (Information continuity), làm nền tảng cho sự tin tưởng (Relational)."}, {"q": "Câu 40: \"Trách nhiệm giải trình\" (Accountability) của bác sĩ YHGĐ khi ký tên vào hồ sơ bệnh án bao hàm yếu tố pháp lý nào nếu xảy ra sự cố y khoa?", "a": ["A. Bác sĩ không phải chịu trách nhiệm nếu bệnh nhân tự uống sai thuốc", "B. Bác sĩ phải chịu trách nhiệm trước pháp luật về tính hợp lý của chẩn đoán, y lệnh và những dặn dò đã ghi chép trong bệnh án", "C. Bệnh viện sẽ chịu trách nhiệm hoàn toàn", "D. Trách nhiệm thuộc về người nhà"], "c": 1, "e": "Hồ sơ bệnh án là chứng cứ pháp lý duy nhất trước tòa để bảo vệ bác sĩ (nếu làm đúng) hoặc buộc tội (nếu làm sai/không ghi chép dặn dò)."}, {"q": "Câu 41: Theo Luật Người cao tuổi Việt Nam, người cao tuổi (NCT) được định nghĩa là người từ độ tuổi nào trở lên?", "a": ["A. Từ đủ 55 tuổi", "B. Từ đủ 60 tuổi", "C. Từ đủ 65 tuổi", "D. Từ đủ 70 tuổi"], "c": 1, "e": "Theo quy định pháp luật của Việt Nam, người từ đủ 60 tuổi trở lên được chính thức công nhận là người cao tuổi."}, {"q": "Câu 42: Tốc độ già hóa dân số tại Việt Nam được đánh giá như thế nào so với thế giới?", "a": ["A. Rất chậm", "B. Trung bình", "C. Nhanh nhất thế giới", "D. Không có sự thay đổi"], "c": 2, "e": "Dân số Việt Nam đang bước vào giai đoạn già hóa với tốc độ thuộc hàng nhanh nhất thế giới do tuổi thọ tăng và mức sinh giảm."}, {"q": "Câu 43: Mục tiêu chính của việc chăm sóc sức khỏe người cao tuổi là gì?", "a": ["A. Chữa khỏi hoàn toàn mọi bệnh mạn tính", "B. Kéo dài tuổi thọ bằng mọi giá, kể cả thở máy vĩnh viễn", "C. Cải thiện, duy trì chất lượng cuộc sống và bảo tồn tối đa chức năng độc lập", "D. Loại bỏ hoàn toàn việc sử dụng thuốc"], "c": 2, "e": "Trong lão khoa, việc duy trì khả năng tự sinh hoạt và chất lượng sống quan trọng hơn việc cố chữa khỏi các bệnh không thể chữa."}, {"q": "Câu 44: Thang điểm ADL (Activities of Daily Living) dùng để đánh giá yếu tố nào ở NCT?", "a": ["A. Chức năng gan thận", "B. Trầm cảm", "C. Các hoạt động sống hàng ngày cơ bản thiết yếu (tắm rửa, mặc quần áo, ăn uống, vệ sinh)", "D. Nhận thức"], "c": 2, "e": "ADL đánh giá mức độ độc lập của bệnh nhân trong việc tự chăm sóc bản thân."}, {"q": "Câu 45: Té ngã ở người cao tuổi thường là do nguyên nhân nào?", "a": ["A. Chỉ do trơn trượt", "B. Do yếu tố nội tại (suy yếu, bệnh lý) và yếu tố ngoại lai (môi trường, thuốc) kết hợp", "C. Chỉ do tác dụng phụ của thuốc", "D. Lão hóa tự nhiên, không thể tránh"], "c": 1, "e": "Té ngã là hội chứng đa yếu tố, thường xảy ra khi một cơ thể suy yếu gặp phải một môi trường không an toàn."}, {"q": "Câu 46: Để dự phòng té ngã tại nhà, biện pháp môi trường nào sau đây là phù hợp nhất?", "a": ["A. Bố trí nhà cửa đủ ánh sáng, dẹp bỏ thảm chùi chân trơn trượt và gọn gàng dây điện", "B. Cho NCT ở trên lầu cao để yên tĩnh", "C. Dùng gạch men bóng để dễ lau chùi", "D. Hạn chế NCT di chuyển hoàn toàn"], "c": 0, "e": "Loại bỏ các chướng ngại vật và đảm bảo thị lực nhìn rõ trong đêm giúp giảm đáng kể tỷ lệ vấp ngã."}, {"q": "Câu 47: Đặc điểm triệu chứng bệnh lý cấp tính (như viêm phổi, nhồi máu cơ tim) ở người cao tuổi thường như thế nào?", "a": ["A. Sốt rất cao, điển hình như người trẻ", "B. Ho khạc đàm rầm rộ, đau ngực dữ dội", "C. Thường không điển hình, có thể chỉ biểu hiện lú lẫn, té ngã, mệt mỏi hoặc bỏ ăn", "D. Luôn có cơn lạnh run"], "c": 2, "e": "Suy giảm dự trữ sinh lý khiến hệ miễn dịch/thần kinh không tạo ra phản ứng điển hình, gọi là \"bệnh biểu hiện ẩn\"."}, {"q": "Câu 48: Polypharmacy (Đa thư thuốc) ở người cao tuổi thường được định nghĩa là sử dụng đồng thời từ bao nhiêu loại thuốc trở lên?", "a": ["A. 2 loại", "B. 3 loại", "C. 5 loại", "D. 10 loại"], "c": 2, "e": "Tiêu chuẩn chung thường xem việc dùng từ 5 loại thuốc trở lên là Polypharmacy, tăng vọt nguy cơ tương tác thuốc."}, {"q": "Câu 49: Sự thay đổi sinh lý về thành phần cơ thể do lão hóa có đặc điểm gì?", "a": ["A. Khối lượng cơ tăng, lượng mỡ giảm", "B. Khối lượng cơ giảm (Sarcopenia), lượng mỡ tăng, tỷ lệ nước toàn phần giảm", "C. Lượng nước trong cơ thể tăng mạnh", "D. Mật độ xương tăng cao"], "c": 1, "e": "Đây là sự chuyển dịch thành phần cơ thể sinh lý, ảnh hưởng lớn đến việc phân bố các loại thuốc."}, {"q": "Câu 50: Hội chứng lão khoa (Geriatric syndromes) bao gồm các tình trạng nào sau đây?", "a": ["A. Nhồi máu cơ tim, đột quỵ", "B. Té ngã, suy yếu (Frailty), sa sút trí tuệ, tiểu không tự chủ, sảng", "C. Sốt xuất huyết, tay chân miệng", "D. Viêm ruột thừa, sỏi mật"], "c": 1, "e": "Đây là những hội chứng đa yếu tố đặc trưng của người già, làm giảm nghiêm trọng chức năng và chất lượng sống."}, {"q": "Câu 51: Sự thay đổi của hệ tiêu hóa ở NCT bao gồm yếu tố nào gây nguy cơ suy dinh dưỡng?", "a": ["A. Răng rụng, giảm tiết nước bọt, giảm nhu động dạ dày ruột", "B. Tăng tiết acid dịch vị", "C. Cảm giác thèm ăn tăng lên", "D. Răng chắc khỏe hơn"], "c": 0, "e": "Việc nhai nuốt khó khăn và hấp thu kém khiến NCT dễ bị sụt cân và thiếu hụt vi chất."}, {"q": "Câu 52: Suy giảm thị lực và thính lực ở NCT dẫn đến rủi ro sức khỏe cộng đồng nào lớn nhất?", "a": ["A. Bệnh gút", "B. Tăng huyết áp", "C. Té ngã, tai nạn giao thông và cô lập xã hội (trầm cảm)", "D. Suy thận"], "c": 2, "e": "Mắt mờ tai điếc khiến NCT dễ vấp ngã, đồng thời họ ngại giao tiếp, dần dần thu mình lại dẫn đến trầm cảm."}, {"q": "Câu 53: Lão hóa hệ tim mạch khiến mạch máu bị cứng lại (giảm đàn hồi). Điều này thường dẫn đến biểu hiện huyết áp nào?", "a": ["A. Tăng huyết áp tâm thu đơn độc", "B. Giảm huyết áp tâm thu", "C. Tăng huyết áp tâm trương đơn độc", "D. Huyết áp bằng 0"], "c": 0, "e": "Động mạch chủ cứng khiến áp lực khi tim bơm máu dội lên rất cao, tạo ra huyết áp tâm thu cao trong khi tâm trương bình thường."}, {"q": "Câu 54: Vấn đề bài tiết nào hay gặp ở NCT gây ảnh hưởng lớn đến tâm lý và sinh hoạt?", "a": ["A. Tăng tạo nước tiểu cô đặc", "B. Sỏi thận", "C. Tiểu không tự chủ (Incontinence) và phì đại tiền liệt tuyến", "D. Đái tháo nhạt"], "c": 2, "e": "Cơ vòng bàng quang yếu, ở nam thì tiền liệt tuyến to gây tiểu rắt, són tiểu khiến họ mặc cảm, hạn chế ra ngoài."}, {"q": "Câu 55: Biện pháp không dùng thuốc nào là nền tảng để duy trì sức khỏe cơ xương khớp ở NCT?", "a": ["A. Uống nhiều canxi", "B. Tập thể dục, duy trì vận động (như đi bộ, Thái cực quyền)", "C. Nằm bất động trên giường", "D. Phẫu thuật thay khớp"], "c": 1, "e": "Vận động kích thích tạo xương, tăng sức mạnh cơ bắp và sự thăng bằng, phòng ngừa suy yếu rất hiệu quả."}, {"q": "Câu 56: Đánh giá lão khoa toàn diện (CGA) bao gồm 4 lĩnh vực cốt lõi nào?", "a": ["A. Hô hấp, Tiêu hóa, Tim mạch, Thần kinh", "B. Thể chất (Bệnh lý), Chức năng, Tâm thần-Nhận thức, và Môi trường-Xã hội", "C. Xét nghiệm máu, X-quang, Siêu âm, CT", "D. Cấp cứu, Nội trú, Ngoại trú, Chăm sóc tại nhà"], "c": 1, "e": "Khác với khám nội khoa thông thường, CGA là một quy trình đa chiều đánh giá cả chức năng sống và hỗ trợ xã hội."}, {"q": "Câu 57: Thang điểm MMSE (Mini-Mental State Examination) được sử dụng để làm gì?", "a": ["A. Đánh giá mức độ trầm cảm", "B. Sàng lọc và đánh giá suy giảm nhận thức / sa sút trí tuệ", "C. Đánh giá nguy cơ suy dinh dưỡng", "D. Kiểm tra thị lực"], "c": 1, "e": "MMSE kiểm tra trí nhớ, định hướng không gian/thời gian, là test kinh điển để phát hiện hội chứng sa sút trí tuệ (như Alzheimer)."}, {"q": "Câu 58: Khác biệt cốt lõi giữa thang điểm ADL và IADL (Instrumental ADL) là gì?", "a": ["A. Không có gì khác biệt", "B. ADL đánh giá sinh hoạt cơ bản, IADL đánh giá các hoạt động công cụ phức tạp hơn (dùng điện thoại, đi chợ, quản lý tiền)", "C. ADL dùng cho người trẻ, IADL dùng cho người già", "D. ADL là khám thực thể, IADL là xét nghiệm máu"], "c": 1, "e": "Mất IADL thường xảy ra trước (ví dụ không biết xài tiền nữa), sau đó bệnh nặng hơn mới mất ADL (không tự xúc cơm ăn được)."}, {"q": "Câu 59: Đặc tính dược động học nào ở NCT làm tăng nguy cơ ngộ độc thuốc tan trong nước?", "a": ["A. Thể tích nước toàn phần trong cơ thể giảm", "B. Lượng mỡ tăng", "C. Chức năng gan tăng", "D. Nhu động ruột tăng"], "c": 0, "e": "Nước giảm khiến nồng độ các thuốc hòa tan trong nước (như Digoxin, Lithium) tăng vọt trong máu, dễ vượt ngưỡng ngộ độc."}, {"q": "Câu 60: Nguyên tắc kê đơn thuốc kinh điển trong Lão khoa để tránh tác dụng phụ là gì?", "a": ["A. Kê liều cao ngay từ đầu để nhanh khỏi", "B. \"Start low, go slow\" (Bắt đầu với liều thấp và tăng từ từ)", "C. Thay đổi thuốc liên tục mỗi ngày", "D. Không dùng thuốc tây"], "c": 1, "e": "Do gan thận suy yếu, NCT chuyển hóa thuốc chậm. Bắt đầu liều bằng 1/2 người trẻ giúp cơ thể thích nghi, tránh sốc thuốc."}, {"q": "Câu 61: Công cụ sàng lọc GDS (Geriatric Depression Scale) được dùng để làm gì?", "a": ["A. Đánh giá trí nhớ", "B. Đánh giá trầm cảm ở người cao tuổi", "C. Đo loãng xương", "D. Đánh giá chức năng nuốt"], "c": 1, "e": "GDS gồm các câu hỏi tập trung vào tâm trạng buồn bã, vô dụng, thiết kế riêng để loại bỏ nhiễu từ các triệu chứng mệt mỏi thể chất."}, {"q": "Câu 62: Khi kiểm soát huyết áp và đường huyết ở NCT có nhiều bệnh nền, nguyên tắc nào cần được ưu tiên?", "a": ["A. Hạ huyết áp/đường huyết càng thấp càng tốt", "B. Kiểm soát chặt chẽ y như người 30 tuổi", "C. Cá thể hóa mục tiêu, nới lỏng chỉ số để tránh hạ huyết áp/đường huyết quá mức gây té ngã và sảng", "D. Bỏ mặc không cần điều trị"], "c": 2, "e": "Cơn hạ đường huyết hoặc tụt huyết áp tư thế có thể làm NCT té gãy xương hoặc nhồi máu cơ tim ngay lập tức, rủi ro cao hơn biến chứng mạn tính."}, {"q": "Câu 63: Việc giảm độ lọc cầu thận (eGFR) sinh lý do lão hóa yêu cầu bác sĩ phải làm gì khi kê toa?", "a": ["A. Tăng liều lượng thuốc lên gấp đôi", "B. Chỉnh liều thuốc theo độ thanh thải Creatinin thực tế của bệnh nhân", "C. Chỉ dùng thuốc bôi ngoài da", "D. Chuyển sang dùng thuốc tiêm"], "c": 1, "e": "Thận bài tiết kém làm thuốc ứ đọng. Rất nhiều thuốc (như kháng sinh, thuốc đái tháo đường) bắt buộc phải giảm liều theo eGFR."}, {"q": "Câu 64: Nhóm thuốc nào sau đây là yếu tố nguy cơ ngoại lai cực kỳ phổ biến gây té ngã ở NCT?", "a": ["A. Vitamin C", "B. Thuốc an thần gây ngủ (Benzodiazepines), thuốc hạ huyết áp, thuốc chống trầm cảm", "C. Men tiêu hóa", "D. Thuốc ho thảo dược"], "c": 1, "e": "Thuốc tác động tâm thần làm giảm phản xạ, lơ mơ; thuốc hạ HA làm chóng mặt khi đổi tư thế."}, {"q": "Câu 65: Đánh giá dinh dưỡng ở NCT thường sử dụng công cụ sàng lọc chuyên biệt nào?", "a": ["A. MNA (Mini Nutritional Assessment)", "B. ECG", "C. MRI não", "D. Spirometry"], "c": 0, "e": "MNA đánh giá sự sụt cân, khả năng nhai nuốt, stress tâm lý để chấm điểm nguy cơ suy dinh dưỡng."}, {"q": "Câu 66: Việc phối hợp giữa Bác sĩ YHGĐ và chuyên viên Vật lý trị liệu nhằm mục đích chính gì?", "a": ["A. Kê toa thuốc mạnh hơn", "B. Cải thiện cơ lực, thăng bằng và dáng đi để phục hồi chức năng và dự phòng té ngã", "C. Phẫu thuật thay khớp", "D. Khám mắt"], "c": 1, "e": "Phục hồi chức năng vận động là can thiệp lõi để điều trị hội chứng Suy yếu (Frailty)."}, {"q": "Câu 67: Test \"Up and Go\" (TUG - Đứng dậy và đi) là một công cụ lâm sàng thực tế dùng để đánh giá yếu tố gì?", "a": ["A. Sức bền tim mạch", "B. Sàng lọc chức năng vận động, thăng bằng và nguy cơ té ngã", "C. Đánh giá trí nhớ ngắn hạn", "D. Đo chức năng phổi"], "c": 1, "e": "Đo thời gian bệnh nhân đứng dậy từ ghế, đi 3m rồi quay lại ngồi xuống. >12 giây là có nguy cơ té ngã cao."}, {"q": "Câu 68: Trong CGA, yếu tố \"Môi trường sống\" được xem xét nhằm mục đích gì?", "a": ["A. Tìm hiểu tài sản của bệnh nhân", "B. Đánh giá nguy cơ té ngã tại nhà và khả năng tiếp cận dịch vụ hỗ trợ cộng đồng (như có người mua đồ ăn, chăm sóc không)", "C. Phân tích phong thủy", "D. Đánh thuế"], "c": 1, "e": "Môi trường an toàn và người chăm sóc (Caregiver) quyết định việc bệnh nhân có thể xuất viện về nhà an toàn hay không."}, {"q": "Câu 69: Hội chứng \"Hạ huyết áp tư thế đứng\" (Orthostatic hypotension) ở NCT được định nghĩa là sự sụt giảm HA như thế nào khi chuyển từ nằm sang đứng trong vòng 3 phút?", "a": ["A. Huyết áp tâm thu giảm $\\ge20mmHg$ hoặc tâm trương giảm $\\ge10mmHg$", "B. Tăng huyết áp lên 20mmHg", "C. Nhịp tim giảm 20 nhịp", "D. Giảm HA tâm thu 5mmHg"], "c": 0, "e": "Mạch máu NCT cứng và phản xạ thần kinh thực vật kém, khi đứng dậy máu dồn xuống chân không bơm kịp lên não gây choáng váng."}, {"q": "Câu 70: Một trong những nguyên nhân khiến việc chẩn đoán bệnh ở NCT khó khăn là do hiện tượng \"Thác bệnh lý\". Điều này nghĩa là gì?", "a": ["A. Bệnh lây từ người này sang người khác", "B. Một cơ quan bị bệnh làm mất bù các cơ quan khác đang suy yếu, dẫn đến suy đa tạng liên hoàn", "C. Bệnh nhân nói dối", "D. Đọc nhầm kết quả xét nghiệm"], "c": 1, "e": "Ví dụ: Viêm phổi gây thiếu oxy -> Tim đập nhanh -> Suy tim cấp -> Tụt HA -> Suy thận cấp. Hiệu ứng domino rất đặc trưng ở người già."}, {"q": "Câu 71: Sự khác biệt cốt lõi về mô hình bệnh tật ở người cao tuổi so với người trẻ là gì?", "a": ["A. Chỉ mắc một bệnh cấp tính rõ ràng", "B. Đa bệnh lý mạn tính đan xen (Multimorbidity), triệu chứng chồng lấp và tương tác bệnh-thuốc phức tạp", "C. Miễn dịch mạnh hơn", "D. Ít dùng thuốc"], "c": 1, "e": "Quản lý bệnh nhân Lão khoa là bài toán cân bằng, điều trị bệnh này (vd: suy tim dùng lợi tiểu) có thể làm trầm trọng bệnh kia (suy thận, gút)."}, {"q": "Câu 72: Tình trạng Suy yếu (Frailty) ở người cao tuổi được định nghĩa đặc trưng bởi yếu tố nào?", "a": ["A. Tăng khối lượng cơ bắp", "B. Tình trạng sụt giảm nghiêm trọng dự trữ sinh lý của nhiều hệ cơ quan, làm tăng tính dễ bị tổn thương trước các stress nhỏ", "C. Chỉ đơn thuần là già đi theo thời gian", "D. Xảy ra ở người ung thư"], "c": 1, "e": "Người Frailty đang ở trạng thái thăng bằng mong manh, chỉ một nhiễm trùng tiểu nhẹ cũng có thể làm họ liệt giường mãi mãi."}, {"q": "Câu 73: Tại sao \"Lú lẫn cấp\" (Sảng / Delirium) được xem là một cấp cứu nội khoa ở người cao tuổi?", "a": ["A. Vì nó gây mất trí nhớ vĩnh viễn ngay lập tức", "B. Vì nó thường là biểu hiện duy nhất hoặc đầu tiên của một bệnh lý cấp tính đe dọa tính mạng (như nhiễm khuẩn huyết, nhồi máu cơ tim, rối loạn điện giải)", "C. Vì nó là giai đoạn cuối của Alzheimer", "D. Vì không có thuốc chữa"], "c": 1, "e": "Sảng là tiếng kêu cứu của bộ não khi cơ thể bị rối loạn chuyển hóa hoặc thiếu oxy nghiêm trọng, cần tìm nguyên nhân thực thể ngay."}, {"q": "Câu 74: Làm thế nào để phân biệt cơ bản giữa Sảng (Delirium) và Sa sút trí tuệ (Dementia)?", "a": ["A. Cả hai giống hệt nhau", "B. Sảng khởi phát đột ngột (vài giờ/vài ngày), dao động và sự chú ý giảm sút mạnh; Sa sút trí tuệ khởi phát âm thầm (vài tháng/năm) và sự chú ý thường bảo tồn ở giai đoạn đầu", "C. Sảng chỉ có ở người trẻ", "D. Dementia có thể chữa khỏi ngay"], "c": 1, "e": "Tính cấp tính và sự thay đổi ý thức (lơ mơ, dao động trong ngày) là chìa khóa để nhận diện Sảng."}, {"q": "Câu 75: Một bệnh nhân 75 tuổi đang dùng 7 loại thuốc khác nhau (Polypharmacy). Bác sĩ YHGĐ cần thực hiện chiến lược gì định kỳ để tối ưu hóa điều trị?", "a": ["A. Kê thêm thuốc bổ gan", "B. Đột ngột ngưng tất cả các thuốc", "C. Rà soát toa thuốc (Medication Review) và mạnh dạn \"khử kê đơn\" (Deprescribing) các thuốc không còn chỉ định hoặc lợi bất cập hại", "D. Khuyên uống thuốc cách nhau 1 giờ"], "c": 2, "e": "Cắt giảm các thuốc không cần thiết (như vitamin, PPI dùng kéo dài vô lý) giúp giảm tác dụng phụ và gánh nặng kinh tế."}, {"q": "Câu 76: Hậu quả của hiện tượng Sarcopenia (Teo cơ/Giảm khối cơ) liên quan trực tiếp đến vòng lẩn quẩn nào?", "a": ["A. Tăng huyết áp kháng trị", "B. Mất sức mạnh -> Ít vận động -> Suy yếu (Frailty) -> Té ngã -> Bất động -> Nằm liệt giường tàn phế", "C. Ngưng thở khi ngủ", "D. Trầm cảm"], "c": 1, "e": "Cơ bắp là cốt lõi của vận động. Mất cơ dẫn đến mất khả năng tự lập, kết cục thường là viện dưỡng lão hoặc tử vong."}, {"q": "Câu 77: Đánh giá Tâm lý - Xã hội trong CGA đặc biệt quan trọng để phát hiện vấn đề gì phổ biến nhưng hay bị che giấu ở NCT?", "a": ["A. Bệnh truyền nhiễm", "B. Tình trạng lạm dụng, bạo hành người cao tuổi (Elder abuse) hoặc sự cô đơn, thiếu mạng lưới hỗ trợ xã hội", "C. Trốn thuế", "D. Gian lận bảo hiểm"], "c": 1, "e": "NCT yếu ớt, phụ thuộc kinh tế/vận động thường là nạn nhân của bạo hành từ người chăm sóc, nhưng họ im lặng vì sợ hãi."}, {"q": "Câu 78: \"Thác kê đơn\" (Prescribing cascade) là một sai lầm nghiêm trọng trong điều trị NCT, khái niệm này nghĩa là gì?", "a": ["A. Kê đơn theo yêu cầu bệnh nhân", "B. Bác sĩ chẩn đoán nhầm TÁC DỤNG PHỤ của thuốc thứ 1 là một BỆNH MỚI, và kê tiếp THUỐC THỨ 2 để điều trị, tạo thành vòng lẩn quẩn gây độc", "C. Bệnh nhân tự ý mua thuốc", "D. Dùng thuốc của người khác"], "c": 1, "e": "Ví dụ: Dùng Amlodipine gây phù chân -> BS tưởng suy tim nên kê thuốc Lợi tiểu -> Lợi tiểu gây gút -> Kê thuốc giảm đau NSAID -> Xuất huyết dạ dày."}, {"q": "Câu 79: Việc tích lũy các thuốc có \"Gánh nặng kháng cholinergic\" (Anticholinergic burden) cao ở người già (như thuốc chống dị ứng thế hệ 1, chống trầm cảm 3 vòng) sẽ gây ra hậu quả gì?", "a": ["A. Tăng cường trí nhớ", "B. Gây lú lẫn, sảng, khô miệng, táo bón nặng, bí tiểu và nhịp tim nhanh", "C. Hạ huyết áp mạnh", "D. Tiêu chảy cấp"], "c": 1, "e": "Hệ cholinergic suy giảm theo tuổi tác. Chẹn thụ thể này thêm bằng thuốc sẽ đánh gục hoàn toàn chức năng nhận thức và bài tiết."}, {"q": "Câu 80: Tại sao nguyên tắc \"Làm việc theo nhóm đa ngành\" (Multidisciplinary team) lại mang tính sống còn trong Lão khoa?", "a": ["A. Để thu nhiều tiền khám", "B. Vì các vấn đề của NCT (y tế, chức năng, xã hội, tâm lý) quá phức tạp, một bác sĩ đơn lẻ không thể giải quyết toàn diện mà cần sự phối hợp của BS, điều dưỡng, vật lý trị liệu, dược sĩ và công tác xã hội", "C. Để bác sĩ được nghỉ ngơi", "D. Để kê được nhiều thuốc hơn"], "c": 1, "e": "Lão khoa là y học tổng hợp, sự phục hồi của bệnh nhân phụ thuộc rất lớn vào dinh dưỡng, tập luyện và chăm sóc điều dưỡng."}, {"q": "Câu 1: Quan điểm truyền thống của y tế Việt Nam về dự phòng được thể hiện qua câu nói nào?", "a": ["A. Có bệnh thì vái tứ phương", "B. Phòng bệnh hơn chữa bệnh", "C. Đói ăn rau, đau uống thuốc", "D. Sống chết có số"], "c": 1, "e": "\"Phòng bệnh hơn chữa bệnh\" là phương châm nền tảng của mạng lưới y tế cơ sở tại Việt Nam nhằm phát hiện sớm và can thiệp ban đầu."}, {"q": "Câu 2: Theo bài giảng, mức độ dự phòng Cấp 0 (Level 0) được định nghĩa là gì?", "a": ["A. Khi bệnh nhân đang mắc bệnh nặng", "B. Tình trạng không có yếu tố nguy cơ", "C. Hạn chế di chứng", "D. Không có bệnh nhưng có yếu tố nguy cơ"], "c": 1, "e": "Dự phòng cấp 0 tập trung vào các chính sách vĩ mô để loại bỏ hoàn toàn các yếu tố nguy cơ từ cộng đồng (VD: cấm đua xe, chống ma túy)."}, {"q": "Câu 3: Hành động \"Tiêm ngừa vắc-xin\" thuộc cấp độ dự phòng nào?", "a": ["A. Dự phòng cấp 0", "B. Dự phòng cấp 1", "C. Dự phòng cấp 2", "D. Dự phòng cấp 3"], "c": 1, "e": "Dự phòng cấp 1 (khi chưa mắc bệnh) giúp bảo vệ cơ thể, tạo miễn dịch chủ động trước khi tiếp xúc với tác nhân gây bệnh."}, {"q": "Câu 4: Mục tiêu của dự phòng Cấp 2 là gì?", "a": ["A. Loại bỏ hoàn toàn yếu tố nguy cơ", "B. Tầm soát sớm bệnh ở giai đoạn tiền lâm sàng và điều trị hiệu quả khi bệnh không nặng", "C. Phục hồi chức năng cho người bị liệt", "D. Ngăn ngừa lạm dụng thuốc"], "c": 1, "e": "Cấp 2 nhằm phát hiện bệnh từ rất sớm (như rối loạn dung nạp đường huyết, ung thư giai đoạn sớm) để ngăn bệnh tiến triển."}, {"q": "Câu 5: Hành động \"Vật lý trị liệu phục hồi chức năng phần cơ thể liệt\" thuộc dự phòng cấp độ nào?", "a": ["A. Dự phòng cấp 1", "B. Dự phòng cấp 2", "C. Dự phòng cấp 3", "D. Dự phòng cấp 4"], "c": 2, "e": "Cấp 3 tập trung vào việc giảm thiểu tác hại và di chứng của bệnh, giúp bệnh nhân tái hòa nhập cộng đồng sau biến cố."}, {"q": "Câu 6: Việc tầm soát sớm ung thư trên đối tượng có nguy cơ là ví dụ của:", "a": ["A. Dự phòng cấp 0", "B. Dự phòng cấp 1", "C. Dự phòng cấp 2", "D. Dự phòng cấp 4"], "c": 2, "e": "Tầm soát ung thư là nỗ lực tìm kiếm bệnh ở giai đoạn chưa có triệu chứng, thuộc phạm trù dự phòng cấp 2."}, {"q": "Câu 7: Một trong những lợi ích lớn nhất của dự phòng là gì?", "a": ["A. Làm tăng doanh thu cho bệnh viện", "B. Ngừa bệnh, nâng cao sức khỏe, cải thiện tỷ lệ tử vong và mang lại lợi ích kinh tế", "C. Tiêu diệt hoàn toàn mọi loại vi khuẩn", "D. Bệnh nhân không cần ăn uống kiêng cữ"], "c": 1, "e": "Dự phòng tốt giúp giảm thiểu số ca tử vong và tiết kiệm hàng tỷ đồng chi phí điều trị ở tuyến cuối."}, {"q": "Câu 8: Cấp độ dự phòng Cấp 4 (Quaternary prevention) tập trung vào vấn đề gì?", "a": ["A. Tiêm chủng cho toàn dân", "B. Hạn chế các can thiệp y khoa không cần thiết, ngăn ngừa lạm dụng thuốc và xét nghiệm", "C. Tầm soát ung thư dạ dày", "D. Chăm sóc cuối đời"], "c": 1, "e": "Cấp 4 bảo vệ bệnh nhân khỏi sự \"y tế hóa quá mức\", tránh các rủi ro từ việc điều trị hoặc xét nghiệm xâm lấn không đáng có."}, {"q": "Câu 9: Theo U.S. Preventive Services Task Force, độ tuổi thích hợp để chụp nhũ ảnh (Mammogram) tầm soát ung thư vú thường được lặp lại mỗi bao nhiêu năm?", "a": ["A. Mỗi 6 tháng", "B. Mỗi 1 năm", "C. Mỗi 2 năm", "D. Mỗi 10 năm"], "c": 2, "e": "Hướng dẫn phổ biến hiện nay khuyên phụ nữ nguy cơ trung bình nên chụp nhũ ảnh định kỳ mỗi 2 năm để cân bằng lợi ích và rủi ro tia X."}, {"q": "Câu 10: Tầm soát ung thư cổ tử cung thường được thực hiện bằng phương pháp nào?", "a": ["A. Chụp MRI vùng chậu", "B. Pap smear (có thể phối hợp test HPV)", "C. Siêu âm ổ bụng", "D. Xét nghiệm máu CEA"], "c": 1, "e": "Xét nghiệm phết tế bào cổ tử cung (Pap smear) mỗi 3-5 năm là tiêu chuẩn vàng để tầm soát tổn thương tiền ung thư."}, {"q": "Câu 11: Khái niệm \"Tầm soát\" (Screening) được hiểu chính xác là gì?", "a": ["A. Chữa bệnh dứt điểm ngay lần đầu gặp bác sĩ", "B. Khả năng phát hiện sớm những tình trạng bệnh nặng, nguy hiểm ngay từ giai đoạn sớm khi bệnh vẫn còn có thể điều trị được", "C. Mổ thám sát để tìm khối u", "D. Kê đơn thuốc giảm đau cho bệnh nhân"], "c": 1, "e": "Tầm soát là tìm kiếm bệnh ở những người trông có vẻ hoàn toàn khỏe mạnh để can thiệp kịp thời."}, {"q": "Câu 12: Theo bác sĩ gia đình, việc khuyên bệnh nhân ngừng hút thuốc lá thuộc dự phòng cấp độ mấy?", "a": ["A. Cấp 0", "B. Cấp 1", "C. Cấp 2", "D. Cấp 3"], "c": 1, "e": "Hút thuốc là yếu tố nguy cơ. Khuyên ngừng hút lá giúp bảo vệ cơ thể khỏi việc phát sinh bệnh lý phổi/tim mạch (Cấp 1)."}, {"q": "Câu 13: Bệnh nhân nữ 55 tuổi đã bị cắt bỏ hoàn toàn tử cung và cổ tử cung vì u xơ 10 năm trước. Bác sĩ YHGĐ nên chỉ định tầm soát ung thư cổ tử cung cho bà ấy như thế nào?", "a": ["A. Pap smear mỗi 6 tháng", "B. Khuyên không cần làm xét nghiệm tầm soát ung thư cổ tử cung nữa", "C. Làm test HPV mỗi 1 năm", "D. Sinh thiết âm đạo"], "c": 1, "e": "Vì bệnh nhân đã bị cắt trọn cổ tử cung do bệnh lý lành tính, bà ấy không còn cơ quan đích để mắc ung thư cổ tử cung nên không cần tầm soát."}, {"q": "Câu 14: Việc chăm sóc hòa nhập cộng đồng cho người bị nghiện ma túy hoặc nhiễm HIV thuộc cấp độ dự phòng nào?", "a": ["A. Cấp 1", "B. Cấp 2", "C. Cấp 3", "D. Cấp 4"], "c": 2, "e": "Đây là quá trình phục hồi chức năng xã hội và hạn chế tối đa sự kỳ thị, giảm tiến triển nặng của di chứng (Cấp 3)."}, {"q": "Câu 15: Đặc điểm nào KHÔNG PHẢI là yếu tố của một xét nghiệm tầm soát lý tưởng?", "a": ["A. Độ nhạy cao (Dương tính ở tất cả người có bệnh)", "B. Độ đặc hiệu cao (Âm tính ở tất cả người không bệnh)", "C. Chi phí thực hiện cực kỳ đắt đỏ", "D. Giá trị dự báo âm tính và dương tính cao"], "c": 2, "e": "Test tầm soát lý tưởng (dù thực tế khó tồn tại hoàn hảo) phải có độ chính xác cao nhưng đồng thời chi phí phải rẻ để áp dụng được cho số đông."}, {"q": "Câu 16: Sự khác biệt cốt lõi giữa hệ thống phân loại dự phòng 4 cấp độ của Marc Jamoulle so với phân loại dự phòng kinh điển (Cấp 1,2,3) là gì?", "a": ["A. Hệ thống kinh điển chỉ có 1 cấp độ", "B. Marc Jamoulle đưa thêm yếu tố \"Quan điểm - nhận định của bệnh nhân về tình trạng sức khỏe\" vào ma trận tương quan với góc nhìn của bác sĩ", "C. Marc Jamoulle bác bỏ việc dùng vắc-xin", "D. Hệ thống kinh điển quan tâm đến cảm xúc bệnh nhân hơn"], "c": 1, "e": "Jamoulle xây dựng bảng chéo 2x2 dựa trên việc bệnh nhân cảm thấy Khỏe/Bệnh kết hợp với việc Bác sĩ khám thấy Có bệnh/Không bệnh."}, {"q": "Câu 17: Theo ma trận của Marc Jamoulle, nếu Bệnh nhân \"cảm thấy bệnh\" nhưng Bác sĩ khám \"không thấy bệnh\", bác sĩ nên áp dụng cấp độ dự phòng nào?", "a": ["A. Cấp 1: Tư vấn di truyền", "B. Cấp 2: Tầm soát ung thư", "C. Cấp 3: Phục hồi chức năng", "D. Cấp 4: Tránh các can thiệp y khoa quá mức"], "c": 3, "e": "Khi bệnh nhân than mệt mỏi nhưng không có tổn thương thực thể, bác sĩ cần tránh lạm dụng chụp chiếu, xét nghiệm hay kê toa vô tội vạ (Dự phòng cấp 4)."}, {"q": "Câu 18: Tầm soát ung thư buồng trứng có nên được thực hiện thường quy trên nhóm phụ nữ khỏe mạnh, không có triệu chứng hay không?", "a": ["A. Có, nên làm siêu âm mỗi tháng", "B. Có, nên làm xét nghiệm CA-125 hàng năm", "C. Không nên làm trên người không có triệu chứng (chưa đủ bằng chứng về lợi ích)", "D. Chỉ làm cho phụ nữ dưới 20 tuổi"], "c": 2, "e": "USPSTF khuyến cáo KHÔNG tầm soát ung thư buồng trứng cho dân số nguy cơ trung bình vì tỷ lệ dương tính giả cao dẫn đến phẫu thuật cắt buồng trứng oan uổng."}, {"q": "Câu 19: Một nguy cơ (Harms) lớn nhất của việc thực hiện một xét nghiệm tầm soát có độ đặc hiệu thấp là gì?", "a": ["A. Âm tính giả cao, bỏ sót người bệnh", "B. Dương tính giả nhiều, khiến bệnh nhân lo lắng tột độ và phải chịu can thiệp chẩn đoán/điều trị quá mức cần thiết", "C. Giúp bệnh nhân tiết kiệm tiền", "D. Bệnh nhân không cần tái khám"], "c": 1, "e": "Đặc hiệu thấp nghĩa là nhiều người khỏe mạnh bị test chẩn đoán nhầm là có bệnh, kéo theo hàng loạt sinh thiết, mổ xẻ rủi ro."}, {"q": "Câu 20: Việc Bác sĩ Gia đình áp dụng Y học chứng cứ (EBM) và chuẩn hóa công tác chuyên môn nhằm hạn chế sai sót được xếp vào dự phòng cấp mấy?", "a": ["A. Cấp 1", "B. Cấp 2", "C. Cấp 3", "D. Cấp 4"], "c": 3, "e": "Việc áp dụng phác đồ chuẩn giúp bảo vệ người bệnh khỏi các quyết định chủ quan, cảm tính của y bác sĩ, thuộc phạm vi dự phòng cấp 4."}, {"q": "Câu 21: Trong tình huống một nam BN 65 tuổi bị nhồi máu não cách đây 2 năm, hiện đang bị liệt nửa người. BS khuyên BN \"hạn chế lên xuống cầu thang, không tự lái xe\" là đang thực hiện:", "a": ["A. Dự phòng cấp 0 (ngừa tai nạn sinh hoạt)", "B. Dự phòng cấp 2", "C. Dự phòng cấp 3", "D. Dự phòng cấp 4"], "c": 0, "e": "Khuyên tránh các yếu tố môi trường có thể gây tai nạn (tạo ra một rủi ro mới hoàn toàn không liên quan đến bệnh cũ) là dự phòng cấp 0."}, {"q": "Câu 22: Ở bệnh nhân đột quỵ cũ, việc \"tính chỉ số nguy cơ tim mạch 10 năm và khuyên ăn giảm mặn, giảm béo\" được xếp vào dự phòng cấp nào?", "a": ["A. Cấp 0", "B. Cấp 1", "C. Cấp 2", "D. Cấp 3"], "c": 1, "e": "Thay đổi lối sống và dinh dưỡng để ngăn chặn sự hình thành các mảng xơ vữa mới (chưa phát bệnh tim mạch vành) là dự phòng cấp 1."}, {"q": "Câu 23: Cùng trên bệnh nhân nhồi máu não đó, BS lên lịch \"đề nghị theo dõi huyết áp tại nhà, xét nghiệm lại mỡ máu và dùng thuốc hạ HA\". Đây là dự phòng cấp mấy?", "a": ["A. Cấp 1", "B. Cấp 2", "C. Cấp 4", "D. Cấp 0"], "c": 1, "e": "Việc sử dụng thuốc để kiểm soát bệnh lý đang hiện hữu (Tăng huyết áp, rối loạn lipid) không cho nó nặng lên là dự phòng cấp 2."}, {"q": "Câu 24: Nếu BN nhồi máu não đã ổn định 1 năm yêu cầu BS chụp lại CT Scan não để \"xem cho chắc\", nhưng BS từ chối và giải thích chụp CT lúc này không mang lại giá trị lâm sàng mà còn nhiễm xạ. BS đang làm gì?", "a": ["A. Dự phòng cấp 1", "B. Dự phòng cấp 2", "C. Dự phòng cấp 3", "D. Dự phòng cấp 4"], "c": 3, "e": "Việc từ chối một kỹ thuật hình ảnh không có chỉ định chuyên môn là hành động bảo vệ bệnh nhân khỏi lãng phí tiền bạc và bức xạ (Cấp 4)."}, {"q": "Câu 25: Điểm mạnh lớn nhất của Bác sĩ gia đình khi thực hiện dự phòng so với các tuyến chuyên khoa sâu là gì?", "a": ["A. Có nhiều máy móc MRI, PET-CT hiện đại nhất", "B. Mối quan hệ tin cậy sâu sắc, tiếp xúc lâu dài và can thiệp ngay trong bối cảnh sống thực tế của bệnh nhân", "C. Chỉ khám 1 lần rồi chuyển viện", "D. Khám bệnh hoàn toàn miễn phí"], "c": 1, "e": "Sự thấu hiểu hoàn cảnh gia đình và sự tin tưởng qua nhiều năm giúp BSGĐ dễ dàng thuyết phục bệnh nhân thay đổi lối sống hơn bất kỳ ai."}, {"q": "Câu 26: Khó khăn từ phía Nhân viên y tế trong việc thực hiện chăm sóc dự phòng thường là gì?", "a": ["A. Quá rảnh rỗi", "B. Không được trả tiền, thiếu thời gian, coi trọng điều trị hơn dự phòng và cảm thấy công việc tư vấn nhàm chán", "C. Bệnh nhân luôn đồng ý mọi lời khuyên", "D. Thuốc dự phòng quá đắt"], "c": 1, "e": "Áp lực công việc khám chữa bệnh cấp tính quá lớn khiến y bác sĩ thường phớt lờ việc dành 15-20 phút chỉ để tư vấn dinh dưỡng."}, {"q": "Câu 27: Trong ma trận của Jamoulle, \"Bệnh nhân cảm thấy Khỏe + Bác sĩ chẩn đoán Không có bệnh\" tương ứng với cấp độ dự phòng nào?", "a": ["A. Cấp 1 (thông tin sức khỏe, tiêm ngừa)", "B. Cấp 2 (tầm soát)", "C. Cấp 3 (phục hồi chức năng)", "D. Cấp 4 (tránh can thiệp)"], "c": 0, "e": "Cả 2 bên đều xác nhận khỏe mạnh, đây là thời điểm lý tưởng để tiêm phòng và giáo dục duy trì sức khỏe (Dự phòng tiên phát - Cấp 1)."}, {"q": "Câu 28: Trong ma trận của Jamoulle, \"Bệnh nhân cảm thấy Khỏe + Bác sĩ chẩn đoán Có bệnh\" tương ứng với cấp độ dự phòng nào?", "a": ["A. Cấp 1", "B. Cấp 2 (tầm soát, chẩn đoán sớm để giảm bệnh hiện mắc)", "C. Cấp 3", "D. Cấp 4"], "c": 1, "e": "Người bệnh không thấy triệu chứng nhưng bác sĩ có thể tìm ra bệnh thông qua các test sàng lọc (Dự phòng thứ phát - Cấp 2)."}, {"q": "Câu 29: Một thách thức lớn hiện nay đối với y học dự phòng là \"Sự thay đổi mô hình bệnh tật\". Điều này cụ thể là gì?", "a": ["A. Chuyển từ bệnh lây nhiễm sang gánh nặng kép (cả bệnh lây nhiễm và các bệnh không lây nhiễm mạn tính)", "B. Bệnh ung thư đã biến mất hoàn toàn", "C. Chỉ còn các bệnh do virus", "D. Trẻ em không còn bị bệnh"], "c": 0, "e": "Xã hội hiện đại vừa phải chống dịch (như Covid, Sốt xuất huyết) vừa phải gồng mình chữa các bệnh chuyển hóa (Tiểu đường, Ung thư)."}, {"q": "Câu 30: Mục đích cốt lõi của một chương trình tầm soát ung thư quần thể là gì?", "a": ["A. Tìm ra tất cả các bệnh trên đời", "B. Tăng doanh thu bán thuốc ung thư", "C. Cải thiện tỷ lệ tử vong do căn bệnh ung thư đó trong cộng đồng", "D. Loại bỏ gen ung thư"], "c": 2, "e": "Bất kỳ một phương pháp tầm soát nào cũng chỉ có giá trị khi nó được khoa học chứng minh là thực sự cứu sống được nhiều người hơn (giảm tỷ lệ tử vong)."}, {"q": "Câu 31: Y học Gia Đình (Family Medicine) được định nghĩa là gì?", "a": ["A. Là một ngành y học thu nhỏ, chỉ chữa các bệnh lặt vặt", "B. Là chuyên khoa sâu cung cấp dịch vụ chăm sóc sức khỏe ban đầu, mang tính chất toàn diện, liên tục và phối hợp cho cá nhân/gia đình", "C. Là chuyên khoa chỉ khám bệnh tại nhà", "D. Là trung tâm trung chuyển bệnh nhân"], "c": 1, "e": "WONCA định nghĩa YHGĐ là một chuyên khoa lâm sàng độc lập, đòi hỏi đào tạo bài bản để giải quyết 90% vấn đề y tế ở tuyến đầu."}, {"q": "Câu 32: Theo Hình vuông Sinh thái học y tế của White (White's Square, 1961), trong 1000 người trưởng thành theo dõi trong 1 tháng, có bao nhiêu người thực sự cần chuyển đến bệnh viện trung tâm tuyến cuối (Tertiary care)?", "a": ["A. 750 người", "B. 250 người", "C. 9 người", "D. 1 người"], "c": 3, "e": "Nghiên cứu kinh điển của White cho thấy: 1000 người -> 750 ốm -> 250 đi khám -> 9 nhập viện thường -> 1 nhập viện tuyến cuối."}, {"q": "Câu 33: Vai trò \"Mô hình bộ lọc thông minh\" (The Filter Effect) của Bác sĩ gia đình có ý nghĩa gì đối với hệ thống y tế?", "a": ["A. Lọc nước uống cho cộng đồng", "B. Giải quyết 80-90% các vấn đề sức khỏe phổ biến tại tuyến 1, chỉ chuyển 10-20% ca bệnh nặng lên tuyến chuyên khoa, giúp chống quá tải bệnh viện", "C. Ngăn cấm không cho bệnh nhân lên tuyến trên", "D. Lọc máu cho bệnh nhân suy thận"], "c": 1, "e": "BSGĐ đóng vai trò \"người gác cổng\" (Gatekeeper), giữ lại các bệnh nhẹ/mạn tính để bệnh viện lớn có không gian cấp cứu ca nặng."}, {"q": "Câu 34: Sự khác biệt triết lý cốt lõi giữa Bác sĩ Gia đình và Bác sĩ Chuyên khoa là gì?", "a": ["A. BS Chuyên khoa tập trung vào \"Disease\" (Căn bệnh tổn thương sinh học), BS Gia đình tập trung vào \"Patient\" (Người bệnh trong bối cảnh xã hội của họ)", "B. BS Chuyên khoa giỏi hơn BS Gia đình", "C. BS Gia đình chỉ dùng thuốc đông y", "D. BS Chuyên khoa khám rẻ hơn"], "c": 0, "e": "Chuyên khoa nhìn bệnh nhân qua lăng kính cơ quan bị hỏng (tim, phổi). BSGĐ nhìn bệnh nhân như một con người với gia đình, tâm lý và văn hóa."}, {"q": "Câu 35: Khái niệm \"Chăm sóc phối hợp\" (Coordinated care) của nguyên lý YHGĐ được thể hiện cụ thể bằng hành động nào?", "a": ["A. Ép bệnh nhân tự chữa bệnh", "B. Khám bệnh, kê đơn và cho về", "C. Làm thư liên lạc/chuyển tuyến cho bác sĩ chuyên khoa, sau đó nhận kết quả về để tiếp tục theo dõi, quản lý hồ sơ sức khỏe", "D. Gọi điện thoại cho công an"], "c": 2, "e": "BSGĐ là \"nhạc trưởng\", kết nối bệnh nhân với các chuyên khoa sâu, vật lý trị liệu... và thu thập mọi dữ liệu về một mối để tránh xung đột thuốc."}, {"q": "Câu 36: Để thực hiện chức năng \"Tiếp cận vấn đề sức khỏe một cách toàn diện\", bác sĩ YHGĐ cần vận dụng mô hình tư duy nào?", "a": ["A. Mô hình Y sinh học thuần túy (Biomedical model)", "B. Mô hình Sinh - Tâm - Xã hội (Biopsychosocial model)", "C. Mô hình kinh tế học vi mô", "D. Mô hình cơ học Newton"], "c": 1, "e": "Bác sĩ không chỉ tìm vi khuẩn (Sinh học), mà còn phải xem xét trầm cảm (Tâm lý) và áp lực nợ nần, ly hôn (Xã hội) gây ra bệnh."}, {"q": "Câu 37: Nghiên cứu về chi phí điều trị triệu chứng đau dạ dày tại Thái Lan (WHO 2008) cho thấy điều gì về vai trò của YHGĐ?", "a": ["A. Khám ở BV tuyến cuối rẻ nhất", "B. Khám ở phòng khám tư nhân rẻ nhất", "C. Hệ thống y tế dựa vào chăm sóc ban đầu (Public health centre, GP) có chi phí điều trị thấp nhất và ít bị lạm dụng nội soi nhất", "D. YHGĐ gây lãng phí tiền bạc"], "c": 2, "e": "Khi bệnh nhân gặp BSGĐ, tỷ lệ bị chỉ định các xét nghiệm xâm lấn đắt tiền (nội soi, chụp phim) thấp hơn rất nhiều so với đi thẳng lên BV tuyến cuối."}, {"q": "Câu 38: Sự khác biệt lớn nhất giữa Trạm y tế xã truyền thống và Mô hình YHGĐ lý tưởng là gì?", "a": ["A. Trạm y tế thu phí cao hơn", "B. Trạm y tế tập trung vào các chương trình mục tiêu quốc gia (khám cắt ngang), YHGĐ tập trung vào quản lý hồ sơ sức khỏe cá nhân/gia đình liên tục suốt đời", "C. YHGĐ chỉ tiêm chủng", "D. Không có khác biệt"], "c": 1, "e": "YHGĐ nâng cấp Trạm y tế từ nơi chỉ phát thuốc cảm, cân trẻ em... thành phòng khám quản lý bệnh mạn tính chuyên nghiệp theo chiều dọc."}, {"q": "Câu 39: Đội ngũ \"Mạng lưới chăm sóc\" (Multidisciplinary team) do BSGĐ điều phối thường bao gồm những ai?", "a": ["A. Chỉ gồm bác sĩ và y tá", "B. Bác sĩ chuyên khoa, điều dưỡng, dược sĩ, chuyên viên vật lý trị liệu, nhân viên xã hội và người chăm sóc tại nhà", "C. Bệnh nhân và người nhà", "D. Giám đốc bệnh viện"], "c": 1, "e": "Chăm sóc toàn diện đòi hỏi sức mạnh tập thể của đa ngành (Multidisciplinary), trong đó BSGĐ đóng vai trò tổng hợp ý kiến."}, {"q": "Câu 40: \"Chăm sóc dựa vào gia đình và cộng đồng\" trong YHGĐ có nghĩa là gì?", "a": ["A. Bác sĩ phải đến ở chung với gia đình bệnh nhân", "B. Bác sĩ chỉ khám bệnh miễn phí", "C. Lợi dụng các nguồn lực gia đình (như người vợ nấu ăn giảm muối) và cộng đồng (câu lạc bộ đi bộ) để hỗ trợ quá trình điều trị của bệnh nhân", "D. Bệnh nhân phải quyên góp tiền cho cộng đồng"], "c": 2, "e": "Sự thay đổi hành vi (VD: bỏ nhậu, ăn lạt) chỉ thành công khi có sự thấu hiểu và đồng hành thực sự từ các thành viên trong gia đình."}, {"q": "Câu 41: Tổ chức Thế giới các bác sĩ gia đình có tên viết tắt tiếng Anh là gì?", "a": ["A. WHO", "B. CDC", "C. WONCA", "D. UNICEF"], "c": 2, "e": "WONCA (World Organization of National Colleges, Academies and Academic Associations of General Practitioners/Family Physicians) thành lập năm 1972."}, {"q": "Câu 42: Lĩnh vực Y học gia đình tập trung vào cung cấp dịch vụ chăm sóc thuộc tuyến nào của hệ thống y tế?", "a": ["A. Chăm sóc tuyến cuối (Tertiary care)", "B. Chăm sóc chuyên sâu (Secondary care)", "C. Chăm sóc sức khỏe ban đầu (Primary care)", "D. Hồi sức cấp cứu"], "c": 2, "e": "YHGĐ là nền tảng của hệ thống y tế, tiếp xúc đầu tiên với bệnh nhân tại cộng đồng."}, {"q": "Câu 43: Có tất cả bao nhiêu nguyên lý cốt lõi của Y học Gia đình?", "a": ["A. 3 nguyên lý", "B. 4 nguyên lý", "C. 5 nguyên lý", "D. 6 nguyên lý"], "c": 3, "e": "6 nguyên lý gồm: Liên tục, Toàn diện, Phối hợp, Lấy cá nhân làm trung tâm, Dựa vào gia đình/cộng đồng, Dự phòng."}, {"q": "Câu 44: Bác sĩ Gia đình (Family Physician) ở một số quốc gia còn được gọi bằng thuật ngữ phổ biến nào?", "a": ["A. Surgeon (Bác sĩ phẫu thuật)", "B. General Practitioner - GP (Bác sĩ đa khoa thực hành)", "C. Pediatrician (Bác sĩ nhi khoa)", "D. Psychiatrist (Bác sĩ tâm thần)"], "c": 1, "e": "GP là danh xưng truyền thống ở Anh và nhiều nước châu Âu để chỉ bác sĩ khám tổng quát tại cộng đồng."}, {"q": "Câu 45: YHGĐ bắt đầu được đưa vào đào tạo tại Việt Nam với sự hỗ trợ của Hoa Kỳ vào khoảng thời gian nào?", "a": ["A. Trước năm 1945", "B. 1998 - 2000", "C. 2015", "D. 2020"], "c": 1, "e": "Từ năm 1998-2000, các dự án hợp tác quốc tế đã đưa môn YHGĐ vào giảng dạy tại ĐH Y Hà Nội và ĐHYD TP.HCM."}, {"q": "Câu 46: Năm 2002 đánh dấu cột mốc quan trọng nào của YHGĐ tại Việt Nam?", "a": ["A. YHGĐ bị cấm giảng dạy", "B. Bộ Y tế chính thức công nhận YHGĐ là một chuyên khoa (CK1)", "C. Toàn bộ bệnh viện đổi tên thành YHGĐ", "D. Lần đầu tiên có giáo sư YHGĐ"], "c": 1, "e": "Sự công nhận mã ngành đào tạo chuyên khoa cấp 1 đánh dấu sự hợp pháp hóa chuyên môn YHGĐ tại Việt Nam."}, {"q": "Câu 47: Việc BSGĐ luôn lên lịch tái khám định kỳ để theo dõi huyết áp qua nhiều năm thể hiện nguyên lý nào?", "a": ["A. Chăm sóc dự phòng", "B. Chăm sóc liên tục", "C. Chăm sóc phối hợp", "D. Chăm sóc cộng đồng"], "c": 1, "e": "Tính liên tục theo thời gian giúp tạo dựng \"hồ sơ sức khỏe\" dọc (Longitudinal), quản lý bệnh mạn tính không bị đứt quãng."}, {"q": "Câu 48: Tại Việt Nam, tình trạng bệnh nhân đổ dồn về các bệnh viện tuyến trung ương (như Từ Dũ, Chợ Rẫy) để khám các bệnh thông thường gây ra hậu quả gì?", "a": ["A. Bệnh viện phá sản", "B. Quá tải bệnh viện nghiêm trọng, nằm ghép giường, hành lang", "C. Bác sĩ tuyến dưới quá tải", "D. Bệnh nhân được chữa khỏi ngay lập tức"], "c": 1, "e": "Việc bỏ qua tuyến cơ sở khiến các BV chuyên khoa nghẽn tắc, chất lượng chăm sóc giảm sút và tăng lây nhiễm chéo."}, {"q": "Câu 49: Mô hình \"Phễu ngược\" trong dòng chảy bệnh nhân ở Việt Nam hiện tại ám chỉ điều gì?", "a": ["A. Bệnh nhân thích khám ở trạm y tế", "B. Bệnh nhân đổ dồn mọi loại bệnh (từ nhẹ đến nặng) thẳng lên bệnh viện tuyến trên", "C. Bệnh viện tuyến trên đẩy bệnh nhân về tuyến dưới", "D. Không ai đi khám bệnh"], "c": 1, "e": "Thay vì sàng lọc hình tháp (giữ bệnh nhẹ ở đáy, đẩy bệnh nặng lên đỉnh), người dân VN vượt tuyến đi thẳng lên đỉnh tháp."}, {"q": "Câu 50: YHGĐ thực hành các chuyên khoa (Nội, Nhi, Sản, Ngoại, Nhiễm...) chủ yếu ở môi trường nào?", "a": ["A. Phòng mổ", "B. Khoa hồi sức cấp cứu ICU", "C. Phòng khám ngoại trú", "D. Khoa nội trú bệnh viện"], "c": 2, "e": "BSGĐ tích hợp kiến thức đa khoa để xử lý các triệu chứng phổ biến thường gặp tại phòng khám ngoại trú (Outpatient)."}, {"q": "Câu 51: \"Kỹ năng giao tiếp và thấu cảm\" được xem là vũ khí mạnh nhất của BSGĐ nhằm mục đích gì?", "a": ["A. Để bán được nhiều thuốc", "B. Để giảm thiểu nguy cơ kiện tụng y khoa và tăng sự tuân thủ điều trị của bệnh nhân", "C. Để quảng cáo phòng khám", "D. Để đuổi bệnh nhân đi nhanh"], "c": 1, "e": "Khi bệnh nhân cảm thấy được bác sĩ lắng nghe và thấu hiểu nỗi đau (Illness), họ sẽ rất ít khi khiếu nại dù có sự cố nhỏ xảy ra."}, {"q": "Câu 52: Bệnh án YHGĐ lưu trữ thông tin gì?", "a": ["A. Chỉ bệnh án của 1 lần nhập viện", "B. Dữ liệu sức khỏe liên tục từ lúc sinh ra đến khi qua đời", "C. Chỉ lưu kết quả siêu âm", "D. Chỉ lưu thông tin hành chính"], "c": 1, "e": "Hồ sơ này giống như cuốn \"hộ chiếu sức khỏe\" đi theo bệnh nhân suốt vòng đời."}, {"q": "Câu 53: Theo định nghĩa của WONCA, YHGĐ KHÔNG PHẢI là gì?", "a": ["A. Chăm sóc ban đầu", "B. Chăm sóc liên tục", "C. Một \"Ngành y học thu nhỏ\" hay \"Trạm sơ cứu tạm thời\"", "D. Chăm sóc toàn diện"], "c": 2, "e": "YHGĐ là một chuyên khoa SÂU về bề rộng (chiều rộng kiến thức tổng quát), không phải là nơi chỉ biết phát vài viên thuốc cảm."}, {"q": "Câu 54: Thực hiện tầm soát sớm các bệnh lý hoặc tiêm phòng cúm là ví dụ của nguyên lý nào?", "a": ["A. Chăm sóc dự phòng", "B. Chăm sóc phối hợp", "C. Chăm sóc liên tục", "D. Chăm sóc gia đình"], "c": 0, "e": "Dự phòng là trụ cột giúp BSGĐ giữ cho cộng đồng của mình khỏe mạnh thay vì chờ họ bệnh mới chữa."}, {"q": "Câu 55: Mô hình y tế chỉ phụ thuộc vào Bệnh viện tuyến cuối sẽ có đặc điểm gì?", "a": ["A. Rất hiệu quả và rẻ tiền", "B. Đắt đỏ, quá tải, bỏ lỡ thời gian vàng điều trị bệnh mạn tính", "C. Không có bệnh nhân nào tử vong", "D. Bác sĩ làm việc rất nhàn nhã"], "c": 1, "e": "Việc sử dụng bác sĩ chuyên khoa sâu để chữa cảm cúm là một sự lãng phí tài nguyên khủng khiếp."}, {"q": "Câu 56: Bối cảnh lịch sử nào trong thập niên 1960 dẫn đến sự ra đời của Y học Gia đình hiện đại?", "a": ["A. Bệnh đậu mùa bùng phát", "B. Sự bùng nổ của các chuyên khoa sâu sau Thế chiến II khiến việc chăm sóc bệnh nhân bị phân mảnh, rời rạc", "C. Sự phát minh ra tia X", "D. Khủng hoảng kinh tế toàn cầu"], "c": 1, "e": "Các bác sĩ đổ xô đi làm chuyên khoa hẹp (Mắt, Tim, Thận), khiến người dân không biết tìm ai khi bị đa bệnh lý phức tạp."}, {"q": "Câu 57: Trong các chức năng của BSGĐ, \"Điều phối các nguồn lực\" (Coordinating resources) đòi hỏi bác sĩ phải làm gì?", "a": ["A. Trực tiếp mổ cho bệnh nhân", "B. Đóng vai trò \"nhạc trưởng\", kết nối bệnh nhân với bác sĩ chuyên khoa, chuyên viên vật lý trị liệu, điều dưỡng tại nhà...", "C. Tự tay pha chế thuốc", "D. Giao bệnh nhân cho bệnh viện và cắt đứt liên lạc"], "c": 1, "e": "Bác sĩ GĐ không làm mọi thứ, mà biết dùng giấy chuyển tuyến để nhờ đúng chuyên gia giải quyết vấn đề, sau đó thu thập lại kết quả."}, {"q": "Câu 58: Sự khác biệt giữa \"Tư duy, triết lý (Nguyên lý YHGĐ)\" và \"Thực thi, nghiệp vụ (Chức năng BSGĐ)\" là gì?", "a": ["A. Nguyên lý thay đổi liên tục, Chức năng thì không đổi", "B. Nguyên lý là giá trị cốt lõi rất bền vững; Chức năng là các nhiệm vụ cụ thể có thể thay đổi theo hướng dẫn điều trị và công nghệ", "C. Cả hai giống hệt nhau", "D. Nguyên lý dùng cho giám đốc, Chức năng dùng cho y tá"], "c": 1, "e": "Triết lý \"Chăm sóc toàn diện\" không bao giờ đổi. Nhưng cách làm (khám online, dùng AI, kê toa điện tử) sẽ thay đổi."}, {"q": "Câu 59: Trong nghiên cứu Hình vuông White (1961), tại sao con số 750 (người có triệu chứng) lại lớn hơn rất nhiều so với 250 (người đi khám bác sĩ)?", "a": ["A. Vì 500 người kia đã chết", "B. Vì phần lớn các triệu chứng (cảm, đau lưng nhẹ) có thể tự khỏi hoặc bệnh nhân tự mua thuốc không cần đến y tế", "C. Vì bác sĩ từ chối khám", "D. Vì không có bệnh viện"], "c": 1, "e": "Phản ánh thực tế \"Tảng băng trôi\" của bệnh tật: Đa số vấn đề sức khỏe được giải quyết tự nhiên ở cộng đồng trước khi chạm ngõ y tế."}, {"q": "Câu 60: Việc quản lý tốt bệnh không lây nhiễm (NCDs) như Đái tháo đường tại phòng khám BSGĐ mang lại hiệu ứng gì cho hệ thống y tế?", "a": ["A. Làm tăng tỷ lệ béo phì", "B. Giảm mạnh số ca nhập viện cấp cứu vì biến chứng đột quỵ, suy thận, từ đó giảm quá tải nội trú", "C. Gây tắc nghẽn trạm y tế", "D. Tăng chi phí bảo hiểm"], "c": 1, "e": "Chặn đứng bệnh ở tuyến cơ sở (Secondary prevention) sẽ dập tắt nguy cơ nổ ra các biến chứng cấp cứu tốn kém ở tuyến cuối."}, {"q": "Câu 61: Mạng lưới chăm sóc (Multidisciplinary care network) của YHGĐ cần sự tin tưởng đôi bên lớn nhất giữa hai đối tượng nào?", "a": ["A. Giám đốc và kế toán", "B. Bác sĩ Gia đình và Bác sĩ Chuyên khoa", "C. Bệnh nhân và bảo vệ", "D. Y tá và dược sĩ"], "c": 1, "e": "BSGĐ cần BS Chuyên khoa giải quyết ca khó; BS Chuyên khoa cần BSGĐ theo dõi dài hạn sau khi xuất viện. Cả 2 phải tôn trọng nhau."}, {"q": "Câu 62: \"Tính liên tục\" trong Mô hình YHGĐ lý tưởng khác Trạm y tế truyền thống ở điểm nào?", "a": ["A. YHGĐ khám xong cấp thuốc rồi thôi", "B. Trạm y tế quản lý hồ sơ điện tử liên thông", "C. YHGĐ quản lý hồ sơ sức khỏe suốt đời từ lúc sinh ra đến khi qua đời, Trạm y tế thường khám theo đợt cấp tính", "D. Không có gì khác biệt"], "c": 2, "e": "YHGĐ là người đồng hành cả đời, nắm rõ mọi thói quen, diễn tiến của bệnh nhân qua từng năm tháng."}, {"q": "Câu 63: Một bệnh nhân bị tăng huyết áp nhẹ nhưng rất sợ uống thuốc. BSGĐ hỏi về nỗi sợ này và động viên bệnh nhân thay đổi lối sống trước. Hành động này thể hiện nguyên lý nào?", "a": ["A. Lấy cá nhân làm trung tâm", "B. Chăm sóc cộng đồng", "C. Phục hồi chức năng", "D. Sàng lọc ung thư"], "c": 0, "e": "Thay vì chỉ nhìn vào con số huyết áp, bác sĩ quan tâm đến cảm xúc, niềm tin (Ideas, Concerns) của người bệnh."}, {"q": "Câu 64: Hành động Bác sĩ GĐ nhận bệnh nhân gãy cổ xương đùi từ Bệnh viện tuyến trên về địa phương để tiếp tục theo dõi, thay băng, tập đi thuộc chức năng nào?", "a": ["A. Chẩn đoán tuyến ban đầu", "B. Can thiệp cộng đồng", "C. Điều phối nguồn lực và Chăm sóc liên tục", "D. Dự phòng cấp 1"], "c": 2, "e": "BSGĐ tiếp quản giai đoạn hậu phẫu, phối hợp với vật lý trị liệu (điều phối) để bệnh nhân không bị bỏ rơi sau xuất viện (liên tục)."}, {"q": "Câu 65: \"Chẩn đoán toàn thể\" (Comprehensive assessment) trong YHGĐ không chỉ xem xét cơ quan bị bệnh mà còn xem xét:", "a": ["A. Tôn giáo của bác sĩ", "B. Yếu tố tình cảm, cảm xúc (mối quan hệ) và Môi trường (văn hóa, bối cảnh gia đình)", "C. Lịch sử chính trị của quốc gia", "D. Cổ phiếu bệnh viện"], "c": 1, "e": "Việc chữa bệnh không thể rập khuôn mà phải nương theo tài chính, văn hóa và cấu trúc hỗ trợ của từng gia đình."}, {"q": "Câu 66: Lợi ích \"Thời gian\" khi khám tại phòng khám BSGĐ so với Bệnh viện lớn là gì?", "a": ["A. Chờ 5 tiếng để khám 3 phút", "B. Bác sĩ khám qua loa cho nhanh", "C. Khám gần nhà, đặt lịch hẹn trước, thời gian chờ ngắn (15-30 phút) và thời gian tư vấn sâu hơn", "D. Phải ngủ lại qua đêm"], "c": 2, "e": "BSGĐ giải quyết bài toán ùn tắc chờ đợi mệt mỏi, mang lại trải nghiệm y tế văn minh và thân thiện."}, {"q": "Câu 67: Nhóm đối tượng nào được liệt kê trong White's square là nguồn đầu vào trực tiếp của Bác sĩ gia đình?", "a": ["A. 1000 người trưởng thành", "B. 9 người nhập viện", "C. 250 người quyết định đi khám bác sĩ", "D. 1 người lên tuyến trung ương"], "c": 2, "e": "250 người có triệu chứng tự cảm thấy cần sự can thiệp y tế sẽ gõ cửa phòng khám ban đầu (Primary care)."}, {"q": "Câu 68: Thư liên lạc / Thư chuyển tuyến của BSGĐ cần nêu rõ thông tin gì nhất?", "a": ["A. Điểm số thi đại học của bệnh nhân", "B. Tóm tắt tình hình (bệnh sử, xét nghiệm đã làm) và Nêu rõ lý do tại sao cần xin ý kiến chuyên khoa", "C. Phàn nàn về bảo hiểm", "D. Hướng dẫn BS chuyên khoa cách mổ"], "c": 1, "e": "Thư chuyển tuyến tốt giúp BS chuyên khoa hiểu ngay vấn đề, không bắt bệnh nhân kể lại từ đầu hay xét nghiệm dư thừa."}, {"q": "Câu 69: YHGĐ là chìa khóa giải quyết \"Mô hình y tế nước nghèo\". Mô hình này ám chỉ điều gì?", "a": ["A. Mọi người đều khỏe mạnh", "B. Tuyến ban đầu yếu kém, trang bị thấp, không hiệu quả dẫn đến quá tải dồn lên các bệnh viện trung ương", "C. Chỉ dùng thuốc nam", "D. Bệnh viện quá vắng vẻ"], "c": 1, "e": "Đầu tư mạnh vào mạng lưới YHGĐ (tuyến 1) là cách duy nhất nâng tầm y tế quốc gia, phá vỡ định kiến \"trạm xá chỉ để tiêm phòng\"."}, {"q": "Câu 70: Sự thay đổi \"Trải nghiệm người bệnh\" từ Mô hình hiện tại sang Mô hình có YHGĐ lý tưởng là gì?", "a": ["A. Từ thân thiện sang mệt mỏi", "B. Từ chi phí hợp lý sang đắt đỏ", "C. Từ mệt mỏi, chờ đợi, chi phí cao SANG thân thiện, liên tục, chi phí hợp lý", "D. Từ khám nhanh sang mổ xẻ"], "c": 2, "e": "Bệnh nhân được đón tiếp bởi người bác sĩ quen thuộc, tiết kiệm chi phí đi lại và tránh các xét nghiệm trùng lặp."}, {"q": "Câu 71: Nếu xem xét \"Dòng chảy bệnh nhân\" trong một hệ thống y tế có mô hình YHGĐ lý tưởng, hình dáng của dòng chảy này sẽ như thế nào?", "a": ["A. Hình phễu ngược (đáy nhỏ, đỉnh to)", "B. Hình vuông", "C. Hình tháp chuẩn (Xử lý phần lớn bệnh nhân ở phần đáy rộng tuyến ban đầu, chỉ 1 lượng rất nhỏ lên đỉnh tháp chuyên khoa)", "D. Hình trụ (tuyến nào cũng bằng nhau)"], "c": 2, "e": "Hình tháp chuẩn (Standard Pyramid) chứng minh hệ thống lọc rất tốt, BSGĐ giữ lại 80-90% lượng bệnh nhân tại đáy tháp."}, {"q": "Câu 72: Bác sĩ A khám cho bệnh nhân bị đái tháo đường. Ngoài kê đơn Insulin, bác sĩ A còn phát hiện bệnh nhân đang có dấu hiệu mờ mắt nên làm giấy chuyển sang Bác sĩ Chuyên khoa Mắt, đồng thời dặn dò tái khám để xem lại kết quả mắt. Hành động này thể hiện CÙNG LÚC 2 nguyên lý nào?", "a": ["A. Dự phòng và Cộng đồng", "B. Toàn diện và Dựa vào gia đình", "C. Phối hợp (Điều phối nguồn lực) và Liên tục (Theo dõi kết quả)", "D. Lấy bệnh nhân làm trung tâm và Cộng đồng"], "c": 2, "e": "Kết nối với BS Mắt (Coordinated/Phối hợp), dặn mang kết quả về phòng khám quản lý tiếp (Continuous/Liên tục)."}, {"q": "Câu 73: Trong ma trận các mức độ dự phòng của Marc Jamoulle, nguy cơ \"Y tế hóa quá mức\" (Over-medicalization) dễ xảy ra nhất khi nào và cần áp dụng cấp độ dự phòng mấy để ngăn chặn?", "a": ["A. Bệnh nhân Khỏe + BS thấy Bệnh -> Dự phòng cấp 2", "B. Bệnh nhân Bệnh + BS thấy Không bệnh -> Dự phòng cấp 4 (Quaternary prevention)", "C. Bệnh nhân Bệnh + BS thấy Bệnh -> Dự phòng cấp 3", "D. Bệnh nhân Khỏe + BS thấy Khỏe -> Dự phòng cấp 1"], "c": 1, "e": "Khi bệnh nhân quá lo âu, đòi chụp MRI, CT khắp người dù không có chỉ định lâm sàng, BSGĐ phải đứng ra giải thích để bảo vệ họ khỏi tia xạ và lãng phí (Cấp 4)."}, {"q": "Câu 74: Tại sao Y học gia đình KHÔNG được xem là \"Ngành nội khoa tổng quát thu nhỏ\"?", "a": ["A. Vì YHGĐ có thể phẫu thuật sọ não", "B. Vì YHGĐ không chỉ gom kiến thức Nội khoa, mà còn tích hợp Nhi, Sản, Nhiễm, Tâm thần, Tai Mũi Họng ở mức độ ngoại trú cơ bản và kỹ năng giao tiếp đặc thù", "C. Vì YHGĐ chỉ chữa bệnh cho người già", "D. Vì YHGĐ không dùng thuốc tây"], "c": 1, "e": "BS Nội tổng quát không khám nhi, không siêu âm thai. BSGĐ phải bao quát mọi lứa tuổi và các vấn đề cơ bản của mọi chuyên khoa."}, {"q": "Câu 75: Việc lạm dụng kháng sinh trong các bệnh lý Tai Mũi Họng do virus (như cảm lạnh) tại phòng khám tư nhân là sự thất bại của chức năng nào trong YHGĐ?", "a": ["A. Điều phối nguồn lực", "B. Chăm sóc liên tục", "C. Can thiệp hướng cộng đồng (Quản lý kháng sinh, Dược-Kinh tế)", "D. Lấy cá nhân làm trung tâm"], "c": 2, "e": "BSGĐ có trách nhiệm bảo vệ sức khỏe cộng đồng bằng cách giáo dục bệnh nhân và chống lại thảm họa kháng kháng sinh toàn cầu."}, {"q": "Câu 76: Sự kiện Declaration of Astana (WHO, 2018) nhấn mạnh lại điều gì?", "a": ["A. Xóa bỏ hoàn toàn y tế cơ sở", "B. Tập trung xây dựng siêu bệnh viện", "C. Khẳng định Chăm sóc sức khỏe ban đầu (Primary Health Care) là cốt lõi để đạt được bao phủ y tế toàn dân", "D. Cấm bác sĩ gia đình hành nghề"], "c": 2, "e": "Tuyên ngôn Astana tái khẳng định tầm nhìn của Alma-Ata (1978), nhấn mạnh đầu tư vào tuyến cơ sở là chiến lược hiệu quả kinh tế nhất."}, {"q": "Câu 77: Trong trường hợp một bệnh nhân lớn tuổi bị té ngã do trơn trượt tại nhà, nguyên lý \"Chăm sóc dựa vào gia đình và môi trường\" yêu cầu Bác sĩ GĐ phải làm gì?", "a": ["A. Bó bột rồi cho về", "B. Kê đơn thuốc giảm đau liều cao", "C. Hướng dẫn người nhà cải tạo môi trường sống (chống trượt, lắp tay vịn, ánh sáng) để ngăn ngừa té ngã lặp lại", "D. Chuyển vào viện dưỡng lão"], "c": 2, "e": "Khám chữa bệnh không chỉ dừng ở cơ thể (bó bột) mà phải tác động vào gốc rễ môi trường xung quanh (nhà cửa) gây ra bệnh."}, {"q": "Câu 78: Thông tư 16/2014/TT-BYT mang lại lợi ích pháp lý gì cho YHGĐ tại Việt Nam?", "a": ["A. Cấm phòng khám tư nhân hoạt động", "B. Xây dựng hành lang pháp lý để cấp phép hoạt động cho mô hình Phòng khám Bác sĩ Gia đình, mở đường cho y tế tư nhân tham gia tuyến đầu", "C. Miễn thuế cho bác sĩ", "D. Bắt buộc mọi người phải có BSGĐ"], "c": 1, "e": "Đây là văn bản quy phạm pháp luật bản lề giúp hình thức \"Phòng khám BSGĐ\" được danh chính ngôn thuận hoạt động tại VN."}, {"q": "Câu 79: Nghiên cứu cho thấy, các quốc gia có mạng lưới YHGĐ (Primary care) mạnh thường có đặc điểm y tế gì so với các quốc gia dựa vào chuyên khoa?", "a": ["A. Tỷ lệ tử vong cao hơn", "B. Chi phí y tế thấp hơn nhưng các chỉ số sức khỏe cộng đồng (tuổi thọ, tử vong trẻ em) lại tốt hơn hoặc tương đương", "C. Bệnh nhân không bao giờ đi khám", "D. Lãng phí thuốc nhiều hơn"], "c": 1, "e": "Mỹ đầu tư khủng vào chuyên khoa sâu nhưng tuổi thọ trung bình lại thấp hơn nhiều nước châu Âu có hệ thống GP (Bác sĩ gia đình) vững chắc."}, {"q": "Câu 80: \"Tính liên tục\" (Continuity) trong YHGĐ được phân thành 3 loại chính, đó là những loại nào?", "a": ["A. Liên tục không gian, liên tục thời gian, liên tục chi phí", "B. Liên tục thông tin (hồ sơ), Liên tục quản lý (kế hoạch điều trị) và Liên tục mối quan hệ (sự tin tưởng BS-BN)", "C. Liên tục thuốc, liên tục xét nghiệm, liên tục phẫu thuật", "D. Mở cửa 24/7, khám mọi lúc, mọi nơi"], "c": 1, "e": "Đây là 3 chiều kích kinh điển của Continuity of Care. Mối quan hệ thấu cảm (Relational continuity) là phần giá trị và khó đạt được nhất."}, {"q": "Câu 1: Trong hệ thống y tế, Bác sĩ Gia đình (BSGĐ) đóng vai trò gì đối với dòng chảy bệnh nhân?", "a": ["A. Người thực hiện phẫu thuật tuyến cuối", "B. Người gác cổng (Gatekeeper) điều phối bệnh nhân", "C. Người vận chuyển bệnh nhân", "D. Người quản lý tài chính bệnh viện"], "c": 1, "e": "BSGĐ giải quyết đa số các vấn đề cơ bản và chỉ chuyển những ca thực sự cần thiết lên tuyến trên, đóng vai trò \"người gác cổng\" tránh quá tải hệ thống."}, {"q": "Câu 2: Chức năng nào sau đây KHÔNG thuộc 5 chức năng cốt lõi của YHGĐ?", "a": ["A. Chẩn đoán, điều trị tuyến ban đầu", "B. Phẫu thuật ghép tạng", "C. Tiếp cận vấn đề sức khỏe toàn diện", "D. Điều phối các nguồn lực"], "c": 1, "e": "Phẫu thuật ghép tạng thuộc về y tế chuyên khoa sâu (tuyến 3), không phải chức năng chăm sóc ban đầu của YHGĐ."}, {"q": "Câu 3: Khái niệm \"Điều phối các nguồn lực\" trong YHGĐ chủ yếu mang ý nghĩa gì?", "a": ["A. Bác sĩ tự tay làm mọi xét nghiệm cho bệnh nhân", "B. Đóng vai trò trung tâm kết nối bệnh nhân với các bác sĩ chuyên khoa, dịch vụ xã hội và hệ thống chăm sóc tại nhà", "C. Phân phát thuốc miễn phí cho cộng đồng", "D. Chỉ định bệnh nhân đi mổ"], "c": 1, "e": "BSGĐ đóng vai trò như một \"nhạc trưởng\", sử dụng hiểu biết của mình để hướng dẫn bệnh nhân đến đúng nơi, gặp đúng chuyên gia."}, {"q": "Câu 4: Khi nào BSGĐ cần quyết định chuyển tuyến (Referral) cho bệnh nhân?", "a": ["A. Bất cứ khi nào bệnh nhân bị cảm cúm", "B. Khi vấn đề sức khỏe vượt quá khả năng chẩn đoán, trang thiết bị hoặc kinh nghiệm điều trị của cơ sở chăm sóc ban đầu", "C. Khi bệnh nhân không có tiền trả viện phí", "D. Khi bệnh nhân yêu cầu dù không có bệnh"], "c": 1, "e": "Chuyển tuyến là quyết định y khoa dựa trên giới hạn chuyên môn tuyến cơ sở và tính chất phức tạp của bệnh lý."}, {"q": "Câu 5: Tài liệu nào là công cụ giao tiếp chính thức quan trọng nhất từ BSGĐ gửi lên Bác sĩ Chuyên khoa?", "a": ["A. Hóa đơn thuốc", "B. Thư chuyển tuyến (Referral letter)", "C. Tin nhắn văn bản", "D. Sổ hộ khẩu của bệnh nhân"], "c": 1, "e": "Thư chuyển tuyến cung cấp tóm tắt bệnh sử, lý do chuyển và câu hỏi cần chuyên gia giải đáp, giúp tiết kiệm thời gian và tránh trùng lặp xét nghiệm."}, {"q": "Câu 6: Bác sĩ Chuyên khoa phản hồi lại cho BSGĐ sau khi khám xong gọi là quá trình gì?", "a": ["A. Chuyển tuyến ngược (Counter-referral / Back-referral)", "B. Bỏ rơi bệnh nhân", "C.
