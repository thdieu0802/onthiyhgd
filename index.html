 Chuyển viện ngang tuyến", "D. Xuất viện"], "c": 0, "e": "Quá trình này giúp trả bệnh nhân về lại tuyến cơ sở kèm theo hướng dẫn điều trị để BSGĐ tiếp tục quản lý lâu dài."}, {"q": "Câu 7: Một lá thư chuyển tuyến chất lượng TỐT cần phải có yếu tố nào?", "a": ["A. Viết thật dài, chép lại toàn bộ hồ sơ từ lúc sinh ra", "B. Súc tích, nêu rõ lý do chuyển tuyến và câu hỏi lâm sàng cần bác sĩ chuyên khoa giải quyết", "C. Bỏ trống phần tiền sử dị ứng thuốc", "D. Không cần ghi chẩn đoán sơ bộ"], "c": 1, "e": "BS Chuyên khoa rất bận rộn, do đó thư chuyển tuyến cần đi thẳng vào vấn đề chính cần họ hỗ trợ."}, {"q": "Câu 8: Mô hình \"Chăm sóc chia sẻ\" (Shared care) thể hiện điều gì?", "a": ["A. Bác sĩ chuyên khoa giữ luôn bệnh nhân", "B. Sự phối hợp quản lý bệnh nhân đồng thời giữa BSGĐ và BS Chuyên khoa (ví dụ: ung thư, tiểu đường thai kỳ)", "C. Bệnh nhân tự chia sẻ thuốc với người nhà", "D. Bệnh viện chia sẻ lợi nhuận cho BSGĐ"], "c": 1, "e": "BS Chuyên khoa quản lý phần đặc trị khó, BSGĐ quản lý các bệnh đồng mắc và theo dõi tác dụng phụ tại nhà."}, {"q": "Câu 9: Việc BSGĐ giữ liên lạc với BS Chuyên khoa phản ánh nguyên lý nào của YHGĐ?", "a": ["A. Chăm sóc phối hợp và liên tục", "B. Chăm sóc dự phòng", "C. Chăm sóc hướng cộng đồng", "D. Chăm sóc lấy gia đình làm trung tâm"], "c": 0, "e": "Điều phối và theo dõi sự xuyên suốt của hồ sơ y tế giữa các tuyến là lõi của nguyên lý liên tục và phối hợp."}, {"q": "Câu 10: Hậu quả của việc thiếu phối hợp giữa BSGĐ và BS Chuyên khoa là gì?", "a": ["A. Bệnh nhân mau khỏi bệnh hơn", "B. Gây lặp lại các xét nghiệm không cần thiết, tương tác thuốc nguy hiểm và tăng chi phí y tế", "C. Hệ thống y tế tiết kiệm được tiền", "D. Bác sĩ rảnh rỗi hơn"], "c": 1, "e": "Sự đứt gãy thông tin (Fragmented care) khiến bệnh nhân chịu rủi ro về can thiệp thừa và nguy cơ ngộ độc do dùng đơn thuốc chồng chéo."}, {"q": "Câu 11: Trong quy trình hội chẩn, ai là người chịu trách nhiệm tổng hợp cuối cùng các ý kiến chuyên khoa để giải thích cho bệnh nhân hiểu?", "a": ["A. Giám đốc bệnh viện", "B. Bác sĩ chuyên khoa sâu nhất", "C. Bác sĩ Gia đình", "D. Điều dưỡng trưởng"], "c": 2, "e": "Với lợi thế thấu hiểu ngôn ngữ, trình độ và tâm lý bệnh nhân, BSGĐ là người dịch các thuật ngữ y khoa phức tạp thành lời khuyên dễ hiểu."}, {"q": "Câu 12: Nhóm đa ngành (Multidisciplinary team) trong mạng lưới chăm sóc của YHGĐ thường KHÔNG bao gồm đối tượng nào dưới đây?", "a": ["A. Dược sĩ lâm sàng", "B. Chuyên viên vật lý trị liệu", "C. Cảnh sát giao thông", "D. Nhân viên công tác xã hội"], "c": 2, "e": "Đội ngũ chăm sóc đa ngành tập trung vào y tế, phục hồi chức năng, tâm lý và hỗ trợ xã hội của người bệnh."}, {"q": "Câu 13: Bệnh nhân vừa phẫu thuật thay khớp háng tại bệnh viện trung ương và được xuất viện. Cơ sở nào phù hợp nhất để tiếp nhận theo dõi, cắt chỉ và tập vật lý trị liệu cho bệnh nhân này?", "a": ["A. Khoa Cấp cứu bệnh viện trung ương", "B. Phòng khám Y học gia đình / Y tế cơ sở địa phương", "C. Khoa Nhi", "D. Bệnh viện Tâm thần"], "c": 1, "e": "Tuyến y tế cơ sở tiếp nhận hậu phẫu giúp bệnh nhân tiện đi lại, tiết kiệm chi phí và giảm tải cho tuyến trung ương."}, {"q": "Câu 14: Khi một bệnh nhân mắc 5 bệnh mạn tính đi khám ở 5 bác sĩ chuyên khoa khác nhau, nguy cơ lớn nhất là gì?", "a": ["A. Bệnh nhân sẽ rất khỏe mạnh", "B. Kê đơn thuốc chồng chéo, quá liều và tương tác thuốc (Polypharmacy)", "C. Tốn ít thời gian", "D. Bác sĩ chuyên khoa sẽ vui vẻ"], "c": 1, "e": "Các BS Chuyên khoa thường chỉ kê thuốc cho bệnh của mình mà không để ý thuốc của chuyên khoa khác, dẫn đến thảm họa tương tác thuốc."}, {"q": "Câu 15: Ai là trung tâm của mọi quá trình điều phối, hội chẩn và chăm sóc?", "a": ["A. Bác sĩ chuyên khoa", "B. Bác sĩ gia đình", "C. Người bệnh", "D. Trưởng khoa"], "c": 2, "e": "YHGĐ thực hành theo mô hình \"Patient-centered care\" (Chăm sóc lấy người bệnh làm trung tâm), mọi quyết định đều xoay quanh lợi ích của họ."}, {"q": "Câu 16: Theo nghiên cứu của O'Malley (2011), rào cản lớn nhất trong việc giao tiếp giữa BS chăm sóc ban đầu và BS chuyên khoa là gì?", "a": ["A. Họ không thích nhau", "B. Hệ thống công nghệ thông tin (Bệnh án điện tử) không liên thông và thiếu thời gian trao đổi", "C. Khoảng cách địa lý quá xa", "D. Bệnh nhân cấm họ liên lạc"], "c": 1, "e": "Sự thiếu hụt một hệ thống dữ liệu dùng chung khiến thư chuyển tuyến bị thất lạc và thông tin không được cập nhật kịp thời (Fragmented EMR)."}, {"q": "Câu 17: Chuyển tuyến \"Bắt buộc\" (Mandatory referral) thường xảy ra trong trường hợp nào?", "a": ["A. Bệnh nhân muốn đi khám sức khỏe tổng quát", "B. Bệnh lý cấp cứu đe dọa tính mạng (như nhồi máu cơ tim cấp) hoặc bệnh đòi hỏi thủ thuật chuyên sâu mà tuyến 1 không có", "C. Bệnh nhân bị viêm họng hạt", "D. Bệnh nhân muốn xin giấy nghỉ ốm"], "c": 1, "e": "Các trường hợp cấp cứu sinh tử hoặc cần máy móc đặc biệt (can thiệp mạch vành, xạ trị) vượt quá phân tuyến kỹ thuật của y tế cơ sở."}, {"q": "Câu 18: Khi nhận được thư chuyển tuyến ngược từ BS Chuyên khoa kèm theo phác đồ mới, BSGĐ cần làm gì?", "a": ["A. Bỏ qua và dùng phác đồ cũ của mình", "B. Cập nhật vào hồ sơ bệnh án, rà soát lại toàn bộ thuốc để tránh tương tác, sau đó giải thích kế hoạch mới cho bệnh nhân", "C. Yêu cầu bệnh nhân trả lại thuốc cho BS Chuyên khoa", "D. Chuyển bệnh nhân đi bệnh viện khác"], "c": 1, "e": "Trách nhiệm của BSGĐ là tổng hợp (Integration) y lệnh mới vào bối cảnh toàn diện của bệnh nhân để đảm bảo an toàn."}, {"q": "Câu 19: Khái niệm \"Tôn trọng ranh giới chuyên môn\" giữa BSGĐ và BS Chuyên khoa có nghĩa là gì?", "a": ["A. Không ai được quyền nói chuyện với ai", "B. BSGĐ không can thiệp vào kỹ thuật mổ của BS Chuyên khoa, ngược lại BS Chuyên khoa không tự ý thay đổi thuốc điều trị tiểu đường/huyết áp nền nếu không bàn bạc với BSGĐ", "C. BS chuyên khoa phải nghe lời BSGĐ hoàn toàn", "D. BSGĐ tự làm mọi thứ"], "c": 1, "e": "Sự phối hợp tốt đòi hỏi mỗi bên làm đúng thế mạnh của mình, tránh can thiệp chéo gây xáo trộn quá trình quản lý mạn tính."}, {"q": "Câu 20: Lợi ích của mô hình \"Stepped care\" (Chăm sóc theo bậc) trong quản lý sức khỏe tâm thần tại phòng khám YHGĐ là gì?", "a": ["A. Chỉ dùng thuốc cho mọi bệnh nhân", "B. Bắt đầu bằng can thiệp cường độ thấp (tư vấn, hỗ trợ tại y tế cơ sở), nếu không đáp ứng mới chuyển dần lên BS tâm thần", "C. Chuyển tất cả lên BV tâm thần trung ương", "D. Bỏ mặc bệnh nhân"], "c": 1, "e": "Mô hình này giúp tối ưu hóa nguồn lực, giải quyết đa số các ca rối loạn lo âu nhẹ tại cộng đồng, để dành chuyên gia cho ca nặng."}, {"q": "Câu 21: Nội dung nào KHÔNG cần thiết phải có trong Thư chuyển tuyến?", "a": ["A. Tóm tắt bệnh sử, khám lâm sàng", "B. Các loại thuốc bệnh nhân đang sử dụng hiện tại", "C. Thu nhập hàng tháng của con cái bệnh nhân", "D. Lý do chuyển tuyến rõ ràng"], "c": 2, "e": "Thư chuyển tuyến mang tính chất y khoa; thông tin tài chính con cái không cần thiết ghi vào trừ khi liên quan trực tiếp đến khả năng chi trả phác đồ đặc biệt."}, {"q": "Câu 22: Khi BS Chuyên khoa khuyên bệnh nhân phẫu thuật nhưng bệnh nhân từ chối vì sợ hãi, vai trò của BSGĐ lúc này là gì?", "a": ["A. Mắng bệnh nhân vì không nghe lời", "B. Cắt đứt quan hệ với bệnh nhân", "C. Khai thác nỗi sợ (ICE), giải thích lại lợi ích/nguy cơ của cuộc phẫu thuật bằng ngôn ngữ quen thuộc để giúp bệnh nhân ra quyết định", "D. Kêu bệnh nhân tự làm phẫu thuật ở nhà"], "c": 2, "e": "Sự tin tưởng sẵn có giúp BSGĐ đóng vai trò nhà tư vấn tâm lý xuất sắc, hỗ trợ bệnh nhân vượt qua khủng hoảng quyết định."}, {"q": "Câu 23: Trong \"Hình vuông sinh thái học y tế\" của White, mối liên hệ giữa chăm sóc ban đầu và chăm sóc chuyên khoa được phản ánh qua thông số nào?", "a": ["A. Cả 1000 người đều phải lên chuyên khoa", "B. Trong 250 người đến khám y tế ban đầu, chỉ khoảng 9 người cần nhập viện thông thường và 1 người cần lên tuyến chuyên khoa sâu", "C. 750 người phải mổ", "D. Không ai cần chuyên khoa"], "c": 1, "e": "Thống kê này chứng minh phần lớn bệnh tật được giải quyết ở tuyến ban đầu, chỉ một lượng rất nhỏ lọt qua \"lưới lọc\" lên tuyến trên."}, {"q": "Câu 24: Một rủi ro phổ biến khi bệnh nhân tự ý đi khám nhiều chuyên khoa (Self-referral) mà không qua BSGĐ là gì?", "a": ["A. Tiết kiệm được tiền", "B. Chẩn đoán sai lệch do triệu chứng bị phân mảnh, không ai nhìn thấy bức tranh toàn cảnh của bệnh nhân", "C. Được điều trị toàn diện hơn", "D. Hệ thống y tế hoạt động trơn tru"], "c": 1, "e": "Bệnh nhân đau ngực tự đi khám tim mạch, nhưng nguyên nhân thực sự có thể là trào ngược dạ dày hoặc rối loạn lo âu, gây tốn kém xét nghiệm tim."}, {"q": "Câu 25: Để việc phối hợp đạt hiệu quả cao, BSGĐ cần xây dựng danh sách gì cho phòng khám của mình?", "a": ["A. Danh sách các món ăn ngon", "B. Mạng lưới các bác sĩ chuyên khoa uy tín, đáng tin cậy trong khu vực để gửi gắm bệnh nhân", "C. Danh sách phim truyền hình", "D. Danh sách nợ xấu"], "c": 1, "e": "Việc sở hữu một danh bạ các chuyên gia quen thuộc giúp quá trình chuyển tuyến nhanh chóng, dễ liên lạc và phản hồi tốt hơn."}, {"q": "Câu 26: Khái niệm \"Chuyển tuyến tùy chọn\" (Elective referral) thường dùng khi nào?", "a": ["A. Bệnh nhân đang ngưng tim", "B. Cần ý kiến thứ hai (Second opinion) cho một ca bệnh khó chẩn đoán hoặc khi điều trị thử tại tuyến cơ sở không đáp ứng", "C. Bệnh nhân bị đứt lìa tay", "D. Bệnh nhân hoàn toàn khỏe mạnh"], "c": 1, "e": "Đây là dạng chuyển tuyến không khẩn cấp, nhằm củng cố chẩn đoán hoặc tìm kiếm giải pháp mới khi phác đồ cũ bế tắc."}, {"q": "Câu 27: Một BS Chuyên khoa nội tiết thay đổi liều Insulin của bệnh nhân nhưng KHÔNG gửi phản hồi về cho BSGĐ. Điều gì dễ xảy ra ở lần khám định kỳ tiếp theo tại phòng khám BSGĐ?", "a": ["A. Bệnh nhân tự khỏi bệnh", "B. BSGĐ không biết, vẫn kê toa theo liều Insulin cũ, dẫn đến bệnh nhân bị hạ hoặc tăng đường huyết nguy hiểm", "C. Không có gì thay đổi", "D. Dược sĩ sẽ tự biết liều mới"], "c": 1, "e": "Đứt gãy thông tin (Fragmented communication) giữa các bác sĩ là nguyên nhân hàng đầu gây ra các sự cố y khoa về sử dụng thuốc."}, {"q": "Câu 28: Trong giai đoạn cuối đời (End-of-life care) của bệnh nhân ung thư, sự phối hợp giữa BS Chuyên khoa Ung bướu và BSGĐ diễn ra như thế nào?", "a": ["A. BS Ung bướu từ chối khám", "B. BS Ung bướu ngừng điều trị đặc hiệu, chuyển bệnh nhân về cho BSGĐ chăm sóc giảm nhẹ, kiểm soát đau và hỗ trợ tâm lý tại nhà", "C. Ép bệnh nhân hóa trị đến ngày cuối cùng", "D. Chuyển bệnh nhân qua khoa nhi"], "c": 1, "e": "Khi y học chuyên khoa không còn giải pháp sinh tồn, YHGĐ tiếp quản để mang lại sự ra đi thanh thản, không đau đớn ngay tại tổ ấm gia đình."}, {"q": "Câu 29: Nếu bệnh nhân phàn nàn về thái độ của BS Chuyên khoa nơi họ được chuyển đến, BSGĐ nên xử lý thế nào?", "a": ["A. Chửi mắng BS Chuyên khoa", "B. La mắng bệnh nhân", "C. Lắng nghe ghi nhận, giải thích khách quan, và nếu cần thiết sẽ tìm một BS chuyên khoa khác phù hợp hơn với tính cách bệnh nhân", "D. Cấm bệnh nhân đi khám tiếp"], "c": 2, "e": "Chức năng \"Người đại diện\" (Advocate) yêu cầu BSGĐ bảo vệ quyền lợi và lựa chọn môi trường y tế tốt nhất cho người bệnh của mình."}, {"q": "Câu 30: \"Tính liên tục về quản lý\" (Management continuity) giữa các tuyến thể hiện qua điều gì?", "a": ["A. Bác sĩ hai bên thống nhất một kế hoạch chăm sóc chung, không đưa ra các chỉ định mâu thuẫn nhau", "B. Bác sĩ tuyến trên luôn xóa bỏ y lệnh của tuyến dưới", "C. Không ai ghi hồ sơ", "D. Bệnh nhân tự quản lý mình"], "c": 0, "e": "Một kế hoạch nhất quán giúp bệnh nhân không bị hoang mang khi nghe 2 bác sĩ đưa ra 2 lời khuyên trái ngược."}, {"q": "Câu 31: Theo WONCA, một hệ thống y tế KHÔNG CÓ sự phối hợp tốt giữa tuyến ban đầu và tuyến chuyên sâu sẽ bị mô tả bằng thuật ngữ gì?", "a": ["A. Hệ thống hoàn hảo", "B. Hệ thống phân mảnh (Fragmented health system), gây lãng phí nguồn lực và giảm chất lượng chăm sóc", "C. Hệ thống y học gia đình", "D. Hệ thống tự động"], "c": 1, "e": "Sự phân mảnh khiến bệnh nhân \"bơi\" trong bệnh viện, tự tìm khoa khám bệnh mà không có ai xâu chuỗi các dữ liệu sức khỏe lại."}, {"q": "Câu 32: Trong quy trình chuyển tuyến, \"Pre-referral workup\" (Xét nghiệm chuẩn bị trước chuyển tuyến) có giá trị gì đối với BS Chuyên khoa?", "a": ["A. Làm tốn tiền bệnh nhân vô ích", "B. Giúp BS Chuyên khoa có ngay dữ liệu nền tảng (VD: siêu âm, chức năng gan thận) để ra quyết định điều trị ngay trong lần khám đầu tiên, rút ngắn thời gian chờ đợi", "C. Làm BS Chuyên khoa tức giận", "D. Để phòng khám thu thêm phí"], "c": 1, "e": "BSGĐ chuẩn bị sẵn \"hồ sơ đẹp\" giúp BS Chuyên khoa bỏ qua các bước sàng lọc cơ bản, đi thẳng vào chẩn đoán chuyên sâu."}, {"q": "Câu 33: Khi BS Chuyên khoa gửi lại bệnh nhân cùng chẩn đoán \"Bệnh lý tâm thể\" (Somatization - Đau không do tổn thương thực thể), BSGĐ cần áp dụng mô hình tư duy nào để tiếp quản?", "a": ["A. Mô hình Y sinh học (Biomedical)", "B. Mô hình Tâm - Sinh - Xã hội (Biopsychosocial model) để tìm hiểu các sang chấn tâm lý, stress gia đình gây ra triệu chứng thể chất", "C. Mô hình Vật lý lượng tử", "D. Khuyên bệnh nhân đi cúng bái"], "c": 1, "e": "Y học chuyên khoa đã loại trừ tổn thương thể chất. BSGĐ phải dùng kỹ năng tâm lý để giải quyết căn nguyên thực sự là stress/trầm cảm."}, {"q": "Câu 34: Sự kiện \"Chuyển tuyến ảo\" (E-consult / Virtual referral) mang lại lợi ích đột phá gì trong sự phối hợp BSGĐ - Chuyên khoa hiện nay?", "a": ["A. Khám bệnh bằng kính VR", "B. BSGĐ gửi hồ sơ và trao đổi với chuyên gia qua nền tảng điện tử, giải quyết bệnh mà không cần bệnh nhân phải đi xa lên bệnh viện tuyến trên", "C. Bệnh nhân khám bệnh qua game", "D. Tự động hóa hoàn toàn bằng AI, không cần bác sĩ"], "c": 1, "e": "Hội chẩn từ xa giúp bệnh nhân vùng sâu vùng xa tiếp cận ý kiến chuyên gia ngay tại Trạm y tế thông qua bác sĩ cơ sở."}, {"q": "Câu 35: Tại sao BSGĐ đôi khi phải đóng vai trò \"Bảo vệ bệnh nhân khỏi y tế hóa quá mức\" (Quaternary prevention) khi làm việc với các BS Chuyên khoa?", "a": ["A. Vì BSGĐ sợ bệnh nhân tốn tiền", "B. Vì BS Chuyên khoa thường có xu hướng chỉ định nhiều xét nghiệm xâm lấn hoặc phẫu thuật có rủi ro cao hơn mức cần thiết cho những vấn đề có thể theo dõi bảo tồn", "C. Vì BS Chuyên khoa không có chuyên môn", "D. Vì BSGĐ muốn tự chữa"], "c": 1, "e": "Góc nhìn chuyên khoa sâu thường thiên về can thiệp (Interventionist). BSGĐ phải cân bằng lại bằng cách đánh giá xem sự can thiệp đó có làm giảm chất lượng sống hiện tại hay không."}, {"q": "Câu 36: Trong mô hình HMO (Health Maintenance Organization), để bệnh nhân được BHYT chi trả khi khám chuyên khoa, họ BẮT BUỘC phải có giấy tờ gì?", "a": ["A. Hóa đơn mua thuốc", "B. Giấy chuyển tuyến (Referral authorization) từ chính Bác sĩ Gia đình của họ", "C. Căn cước công dân", "D. Không cần giấy gì"], "c": 1, "e": "HMO sử dụng BSGĐ làm Gatekeeper bắt buộc về mặt tài chính để kiểm soát chi phí lạm dụng dịch vụ chuyên khoa."}, {"q": "Câu 37: Khi một bệnh nhân chuyển từ khoa Hồi sức tích cực (ICU) về cộng đồng, BSGĐ cần thực hiện \"Transition of care\" (Chuyển tiếp chăm sóc). Rủi ro lớn nhất trong giai đoạn này là gì?", "a": ["A. Bệnh nhân không nhận ra nhà mình", "B. Sai sót về danh mục thuốc (Medication discrepancies) do sự thay đổi phác đồ giữa bệnh viện và nhà", "C. Bệnh nhân đi lạc", "D. Không có thuốc để bán"], "c": 1, "e": "Khi xuất viện, bệnh nhân thường mang về một mớ hỗn độn thuốc mới trộn lẫn thuốc cũ. Đối chiếu thuốc (Medication reconciliation) là việc sống còn của BSGĐ lúc này."}, {"q": "Câu 38: Sự khác biệt về văn hóa nghề nghiệp (Professional culture) giữa BSGĐ và BS Ngoại khoa ảnh hưởng thế nào đến giao tiếp?", "a": ["A. BS Ngoại khoa thích nói chuyện dài dòng", "B. BSGĐ thường chú trọng quá trình, giao tiếp dài hạn; BS Ngoại khoa chú trọng kết quả dứt điểm, hành động nhanh. Sự khác biệt này dễ gây hiểu lầm nếu thư chuyển tuyến không đúng trọng tâm", "C. Không có sự khác biệt", "D. Hai bên không hiểu tiếng của nhau"], "c": 1, "e": "Bác sĩ ngoại khoa cần thông tin định lượng, giải phẫu rõ ràng để quyết định mổ hay không. BSGĐ quen với việc viết về tâm lý, hoàn cảnh, nếu viết dài dòng sẽ làm BS ngoại khoa khó chịu."}, {"q": "Câu 39: Vai trò của Điều dưỡng chăm sóc tại nhà (Home health nurse) trong mạng lưới phối hợp này là gì?", "a": ["A. Thay thế hoàn toàn Bác sĩ gia đình", "B. Làm \"tai mắt\" cho BSGĐ và BS Chuyên khoa, thực hiện y lệnh, thay băng và báo cáo tình trạng bệnh nhân hậu phẫu/mạn tính trực tiếp từ nhà", "C. Phẫu thuật tại nhà", "D. Chở bệnh nhân đi dạo"], "c": 1, "e": "Điều dưỡng cộng đồng là cánh tay nối dài, giúp khép kín vòng tròn chăm sóc từ viện về nhà mà vẫn đảm bảo chuyên môn."}, {"q": "Câu 40: Mô hình ECHO (Extension for Community Healthcare Outcomes) là một phương pháp phối hợp nhằm mục đích gì?", "a": ["A. Siêu âm tim cho cộng đồng", "B. Tổ chức các buổi hội chẩn trực tuyến định kỳ, nơi các Chuyên gia tuyến cuối huấn luyện chuyên môn (mentorship) cho các BSGĐ tuyến cơ sở về cách quản lý các ca bệnh khó", "C. Cấp thuốc từ xa", "D. Viết bệnh án tự động"], "c": 1, "e": "ECHO không chỉ để hội chẩn 1 ca, mà là cách \"dạy nghề\", chuyển giao kiến thức từ chuyên khoa xuống cơ sở để BSGĐ dần tự tin xử lý các ca tương tự."}, {"q": "Câu 41: Khái niệm \"Vòng đời người\" (Human Lifecycle) theo y sinh học và xã hội học được hiểu là gì?", "a": ["A. Chỉ từ lúc sinh ra đến lúc 18 tuổi", "B. Chu trình từ khi hình thành, sinh ra, lớn lên, trưởng thành, lão hóa và kết thúc bằng cái chết", "C. Cuộc đời của một vận động viên", "D. Chu kỳ thay tế bào máu"], "c": 1, "e": "Vòng đời bao hàm tất cả các sự kiện sinh học, tâm lý và xã hội nối tiếp nhau theo thời gian của một cá nhân."}, {"q": "Câu 42: Thời kỳ \"Sơ sinh\" (Neonatal period) được tính trong khoảng thời gian nào?", "a": ["A. Từ khi sinh đến hết 1 tháng (4 tuần) đầu tiên", "B. Từ 1 đến 12 tháng", "C. Từ 1 đến 3 tuổi", "D. Từ lúc mang thai đến khi sinh"], "c": 0, "e": "28 ngày đầu đời là giai đoạn cực kỳ nguy hiểm, trẻ phải thích nghi với môi trường sống độc lập ngoài bụng mẹ."}, {"q": "Câu 43: Thời kỳ \"Nhũ nhi\" (Infancy) có đặc điểm nổi bật nhất về dinh dưỡng là gì?", "a": ["A. Chỉ ăn thịt", "B. Sữa mẹ là nguồn thức ăn chủ yếu và tốt nhất", "C. Trẻ có thể ăn cơm người lớn", "D. Uống nước ngọt thay nước"], "c": 1, "e": "Nhũ nhi (từ tháng thứ 2 đến 12) là giai đoạn hệ tiêu hóa còn non yếu, sữa mẹ cung cấp kháng thể và dinh dưỡng hoàn hảo nhất."}, {"q": "Câu 44: Về mặt vận động, một trẻ phát triển bình thường thường biết \"đứng chập chững và đi vài bước\" vào khoảng độ tuổi nào?", "a": ["A. 3 tháng", "B. 6 tháng", "C. 12 - 15 tháng", "D. 24 tháng"], "c": 2, "e": "Các cột mốc vận động thô: 3 tháng biết lật, 6 tháng biết ngồi, 9 tháng biết bò, 12 tháng bắt đầu đi men/đứng chững."}, {"q": "Câu 45: Thời kỳ \"Dậy thì\" (Puberty) đặc trưng bởi sự thay đổi sinh lý nào mạnh mẽ nhất?", "a": ["A. Rụng răng sữa", "B. Sự phát triển vượt bậc về chiều cao, cân nặng và sự hoàn thiện các cơ quan sinh dục thứ phát do thay đổi nội tiết tố", "C. Bắt đầu tập nói", "D. Tóc bạc đi"], "c": 1, "e": "Hormone giới tính (testosterone, estrogen) bùng nổ, biến đổi hoàn toàn cơ thể trẻ em thành cơ thể người trưởng thành có khả năng sinh sản."}, {"q": "Câu 46: Mốc đánh dấu sự bắt đầu giai đoạn \"Tuổi trưởng thành\" (Adulthood) về mặt thể chất và xã hội thường là khi nào?", "a": ["A. 12 tuổi", "B. Khi cá nhân đạt được sự trưởng thành về sinh lý, có khả năng lao động tự lập và chịu trách nhiệm pháp lý (thường từ 18-20 tuổi)", "C. Khi có con", "D. Khi nghỉ hưu"], "c": 1, "e": "Giai đoạn này cơ thể phát triển đạt đỉnh cao sức mạnh, cá nhân bắt đầu tìm kiếm việc làm và xây dựng gia đình."}, {"q": "Câu 47: \"Mãn kinh\" (Menopause) ở phụ nữ trung niên là sự kiện sinh học đánh dấu điều gì?", "a": ["A. Mới bắt đầu dậy thì", "B. Sự chấm dứt kinh nguyệt vĩnh viễn và mất khả năng sinh sản tự nhiên", "C. Mắc bệnh ung thư", "D. Sự phát triển mạnh mẽ của xương"], "c": 1, "e": "Thường xảy ra ở độ tuổi 45-55 do buồng trứng suy giảm và ngừng tiết estrogen."}, {"q": "Câu 48: Một trong những đặc điểm tâm lý dễ gặp ở tuổi Vị thành niên (Adolescence) là gì?", "a": ["A. Ngoan ngoãn tuyệt đối, thích phụ thuộc cha mẹ", "B. Khủng hoảng bản sắc cá nhân, thích khẳng định mình, dễ bị bạn bè lôi kéo và có xu hướng nổi loạn", "C. Chỉ thích ở một mình không tiếp xúc ai", "D. Rất cẩn thận trong việc chi tiêu"], "c": 1, "e": "Trẻ vị thành niên muốn thoát khỏi sự kiểm soát của cha mẹ, dễ rơi vào các hành vi nguy cơ (hút thuốc, đua xe, quan hệ tình dục sớm)."}, {"q": "Câu 49: Tầm soát bệnh ở độ tuổi Trưởng thành trẻ (20-39 tuổi) thường tập trung vào những vấn đề gì?", "a": ["A. Tầm soát ung thư dạ dày", "B. Tầm soát loãng xương", "C. Kiểm tra BMI, huyết áp định kỳ, tầm soát bệnh lây truyền qua đường tình dục (STDs) và các yếu tố nguy cơ lối sống", "D. Đo điện não đồ"], "c": 2, "e": "Ở tuổi này, bệnh lý mạn tính chưa nhiều, nhưng các thói quen xấu (rượu, thuốc lá) và đời sống tình dục mở là rủi ro chính."}, {"q": "Câu 50: Thời kỳ tiền học đường (Mẫu giáo, 3-6 tuổi), sự phát triển nào là nhanh chóng và nổi bật nhất?", "a": ["A. Sinh sản", "B. Phát triển ngôn ngữ, khả năng giao tiếp xã hội và tư duy tượng trưng", "C. Chiều cao tăng 20cm/năm", "D. Rụng toàn bộ tóc"], "c": 1, "e": "Trẻ học cách chơi cùng bạn, học nói rất nhanh (từ vựng tăng vọt) và liên tục đặt câu hỏi \"Tại sao?\"."}, {"q": "Câu 51: Sự lão hóa (Aging) mang tính chất gì đối với con người?", "a": ["A. Bệnh lý lây nhiễm", "B. Quá trình tự nhiên, tất yếu, diễn ra liên tục làm suy giảm dần các chức năng sinh lý của cơ thể", "C. Có thể đảo ngược bằng thuốc", "D. Chỉ xảy ra ở người bệnh"], "c": 1, "e": "Lão hóa không phải là bệnh, mà là sự thoái hóa sinh học theo chương trình mà mọi sinh vật đều phải trải qua."}, {"q": "Câu 52: Giai đoạn cuối của vòng đời, con người phải đối mặt với sự kiện tất yếu nào?", "a": ["A. Cái chết (Death)", "B. Tái sinh", "C. Trẻ lại", "D. Dậy thì lần 2"], "c": 0, "e": "Chăm sóc giảm nhẹ và chuẩn bị tâm lý cho cái chết là một phần không thể thiếu của YHGĐ trong việc quản lý vòng đời."}, {"q": "Câu 53: Yếu tố nguy cơ ảnh hưởng lớn nhất đến sức khỏe ở lứa tuổi Trung niên (40-60 tuổi) thường là gì?", "a": ["A. Ngạt nước, sặc sữa", "B. Tai nạn khi đua xe", "C. Sự tích lũy của lối sống kém lành mạnh dẫn đến các bệnh mạn tính: Đái tháo đường, Tăng huyết áp, Rối loạn lipid máu", "D. Nhiễm trùng sơ sinh"], "c": 2, "e": "Cơ thể bắt đầu giảm chuyển hóa, nếu ăn uống không kiểm soát, các bệnh lý chuyển hóa sẽ bùng phát ở tuổi này."}, {"q": "Câu 54: Vaccine nào cực kỳ quan trọng được tiêm ngay trong 24 giờ đầu sau sinh cho thời kỳ Sơ sinh?", "a": ["A. Vaccine Viêm gan B", "B. Vaccine Ung thư cổ tử cung (HPV)", "C. Vaccine Sởi", "D. Vaccine Viêm não Nhật Bản"], "c": 0, "e": "Trẻ sơ sinh cần tiêm Lao và Viêm gan B ngay sau lọt lòng để tránh lây nhiễm từ mẹ và môi trường."}, {"q": "Câu 55: Trẻ em trong thời kỳ bú mẹ có nguy cơ suy giảm lượng kháng thể nhận từ mẹ (miễn dịch thụ động) vào khoảng thời gian nào, khiến trẻ dễ bị ốm vặt (Khoảng trống miễn dịch)?", "a": ["A. Từ 1 - 2 tháng", "B. Từ 6 tháng đến 3 tuổi", "C. Từ 5 - 10 tuổi", "D. Khi trẻ 18 tuổi"], "c": 1, "e": "Kháng thể IgG từ mẹ truyền qua nhau thai bị đào thải dần và cạn kiệt lúc 6 tháng, trong khi hệ miễn dịch của trẻ chưa tự sản xuất đủ."}, {"q": "Câu 56: Đánh giá biểu đồ tăng trưởng (Growth Chart) ở trẻ em, đường bách phân vị thứ 50 (50th percentile) có ý nghĩa gì?", "a": ["A. Trẻ bị suy dinh dưỡng nặng", "B. Trẻ phát triển ở mức trung bình chuẩn so với các trẻ cùng tuổi và giới tính", "C. Trẻ bị béo phì độ 3", "D. Chiều cao của trẻ là 50cm"], "c": 1, "e": "Percentile 50 nghĩa là trẻ nằm ở mức giữa; 50% trẻ em trên thế giới cao/nặng hơn mức này và 50% thấp/nhẹ hơn."}, {"q": "Câu 57: Hội chứng \"Tổ ấm rỗng\" (Empty Nest Syndrome) thường xảy ra trong giai đoạn nào của Vòng đời gia đình?", "a": ["A. Mới kết hôn", "B. Có con nhỏ", "C. Giai đoạn con cái trưởng thành rời khỏi nhà đi học, đi làm hoặc kết hôn", "D. Khi vợ chồng chuẩn bị sinh con thứ 2"], "c": 2, "e": "Cha mẹ trung niên đối mặt với sự trống trải, hụt hẫng khi không còn phải chăm lo cho con cái mỗi ngày, dễ dẫn đến trầm cảm."}, {"q": "Câu 58: Ở độ tuổi Trung niên (40-60 tuổi), công tác tầm soát (Screening) bệnh lý nào bắt đầu được chú trọng đưa vào thường quy?", "a": ["A. Test tự kỷ", "B. Tầm soát ung thư đại trực tràng, ung thư vú, ung thư cổ tử cung và các bệnh tim mạch", "C. Khám dậy thì sớm", "D. Siêu âm khớp háng bẩm sinh"], "c": 1, "e": "Nguy cơ ung thư và tim mạch tăng vọt sau tuổi 40, đòi hỏi các chương trình tầm soát diện rộng (vd nội soi đại tràng từ 45 tuổi)."}, {"q": "Câu 59: Rối loạn trầm cảm sau sinh (Postpartum depression) là vấn đề sức khỏe tâm thần nghiêm trọng ảnh hưởng trực tiếp đến 2 đối tượng nào trong vòng đời?", "a": ["A. Cha và ông bà", "B. Mẹ (Người phụ nữ) và sự phát triển của Đứa trẻ nhũ nhi", "C. Con lớn và bạn bè", "D. Chỉ ảnh hưởng người mẹ"], "c": 1, "e": "Trầm cảm khiến mẹ bỏ bê chăm sóc hoặc thậm chí có ý nghĩ làm hại con, ảnh hưởng trầm trọng đến sự gắn kết mẹ-con (attachment)."}, {"q": "Câu 60: Khái niệm \"Sandwich Generation\" (Thế hệ bánh mì kẹp) dùng để chỉ áp lực của nhóm người nào trong vòng đời?", "a": ["A. Trẻ em phải ăn nhiều bánh mì", "B. Những người trung niên vừa phải chăm lo cho con cái đang lớn, vừa phải gánh vác việc phụng dưỡng cha mẹ già yếu", "C. Thanh niên thất nghiệp", "D. Người già sống trong viện dưỡng lão"], "c": 1, "e": "Nhóm người này (thường 40-50 tuổi) bị kẹp ở giữa 2 thế hệ phụ thuộc, chịu áp lực khủng khiếp về tài chính và tâm lý."}, {"q": "Câu 61: Động kinh sốt cao co giật (Febrile seizures) là tình trạng cấp cứu thần kinh thường gặp nhất ở giai đoạn nào của vòng đời trẻ em?", "a": ["A. Sơ sinh (dưới 1 tháng)", "B. Trẻ từ 6 tháng đến 5 tuổi (phổ biến nhất 1-2 tuổi)", "C. Trẻ vị thành niên", "D. Trẻ trên 10 tuổi"], "c": 1, "e": "Não bộ trẻ nhỏ chưa phát triển hoàn thiện, dễ bị kích thích phóng điện gây co giật khi nhiệt độ cơ thể tăng đột ngột."}, {"q": "Câu 62: Lão hóa hệ thần kinh ở người cao tuổi thường biểu hiện bằng các thay đổi sinh lý nào?", "a": ["A. Tăng trí nhớ ngắn hạn", "B. Giảm thời gian phản xạ, rối loạn giấc ngủ, teo vỏ não và suy giảm nhận thức nhẹ", "C. Ngủ rất nhiều, 14 tiếng/ngày", "D. Tái tạo tế bào thần kinh liên tục"], "c": 1, "e": "Não mất dần neuron, các chất dẫn truyền thần kinh sụt giảm khiến người già chậm chạp, hay quên và khó ngủ sâu."}, {"q": "Câu 63: Yêu cầu dinh dưỡng ở người cao tuổi có đặc điểm gì cần lưu ý để tránh bệnh tật?", "a": ["A. Ăn càng nhiều năng lượng càng tốt", "B. Giảm nhu cầu năng lượng tổng thể nhưng tăng nhu cầu về chất đạm (Protein) dễ tiêu, chất xơ, Canxi và Vitamin D", "C. Cắt bỏ hoàn toàn tinh bột", "D. Chỉ uống sữa, không ăn thức ăn thô"], "c": 1, "e": "Lão hóa làm giảm khối cơ (sarcopenia) và loãng xương, do đó cần bổ sung đủ đạm và canxi dù lượng calo nạp vào giảm."}, {"q": "Câu 64: Biện pháp hiệu quả nhất để dự phòng bệnh còi xương ở trẻ nhũ nhi là gì?", "a": ["A. Tắm nắng đúng cách và bổ sung Vitamin D dự phòng ngay từ sau sinh", "B. Cho uống canxi liều cao mỗi ngày", "C. Uống nước ép trái cây", "D. Cho trẻ ngủ nhiều trong phòng tối"], "c": 0, "e": "Sữa mẹ có lượng Vitamin D rất thấp, việc bổ sung Vitamin D3 đường uống (400 IU/ngày) là khuyến cáo y khoa chuẩn mực."}, {"q": "Câu 65: Giai đoạn tiền học đường (3-6 tuổi), trẻ dễ mắc các bệnh lý nào do sự thay đổi môi trường sống (bắt đầu đi lớp)?", "a": ["A. Loãng xương, tiểu đường", "B. Nhiễm trùng hô hấp cấp (viêm họng, viêm amidan, viêm phế quản) và bệnh truyền nhiễm (tay chân miệng, thủy đậu)", "C. Đột quỵ", "D. Viêm loét dạ dày tá tràng"], "c": 1, "e": "Việc tiếp xúc đông đúc ở nhà trẻ cùng với hệ miễn dịch chưa hoàn thiện khiến lứa tuổi này mắc các bệnh lây qua đường hô hấp/tiêu hóa liên tục."}, {"q": "Câu 66: Mối quan tâm hàng đầu trong chăm sóc sức khỏe phụ nữ tuổi mãn kinh là dự phòng các biến cố nào?", "a": ["A. Mụn trứng cá", "B. Rụng tóc", "C. Bốc hỏa trầm trọng, loãng xương, và sự gia tăng nhanh chóng nguy cơ bệnh tim mạch", "D. Viêm ruột thừa"], "c": 2, "e": "Estrogen sụt giảm làm mất lớp bảo vệ xương và mạch máu, khiến phụ nữ nhanh chóng bị xốp xương và xơ vữa động mạch."}, {"q": "Câu 67: Theo Erickson, nhiệm vụ phát triển tâm lý xã hội cốt lõi của tuổi Trưởng thành sớm (Young adulthood) là gì?", "a": ["A. Xây dựng lòng tin với thế giới", "B. Tìm kiếm sự gắn bó, thân mật (Intimacy) thông qua tình yêu và hôn nhân, tránh sự cô lập (Isolation)", "C. Nhìn lại cuộc đời", "D. Đi học chữ"], "c": 1, "e": "Sau khi khẳng định được cái tôi ở tuổi teen, thanh niên tìm kiếm bạn đời để xây dựng các mối quan hệ sâu sắc, bền vững."}, {"q": "Câu 68: Suy giảm thính lực tuổi già (Presbycusis) thường đặc trưng bởi việc mất khả năng nghe âm thanh ở dải tần số nào trước tiên?", "a": ["A. Âm trầm (tần số thấp)", "B. Âm thanh tần số cao (tiếng chim hót, tiếng còi, phụ âm gió)", "C. Chỉ điếc 1 bên tai", "D. Nghe tiếng ồn ào rất rõ"], "c": 1, "e": "Tế bào lông ở đáy ốc tai (nhận cảm âm cao) bị thoái hóa trước, khiến người già khó nghe phụ âm, dẫn đến nghe lùng bùng không hiểu người khác nói gì."}, {"q": "Câu 69: Hội chứng suy yếu (Frailty) ở người cao tuổi phản ánh tình trạng gì của chu kỳ sống?", "a": ["A. Người già đột nhiên mập lên", "B. Sự suy giảm nghiêm trọng về dự trữ sinh lý, làm mất khả năng phục hồi khi gặp các stress nhỏ (như cảm cúm, chuyển chỗ ở)", "C. Tình trạng lão hóa khỏe mạnh", "D. Sức mạnh cơ bắp tăng lên"], "c": 1, "e": "Frailty là bước đệm giữa sống độc lập và tàn phế, người suy yếu rất mong manh, dễ té ngã và dễ tử vong chỉ vì một cú sốc nhỏ."}, {"q": "Câu 70: Để tư vấn tránh thai an toàn cho phụ nữ trưởng thành chưa muốn sinh con, BSGĐ cần đánh giá yếu tố nào quan trọng nhất trước khi kê thuốc viên tránh thai kết hợp?", "a": ["A. Kích thước vòng bụng", "B. Tiền sử tăng huyết áp, huyết khối tĩnh mạch, hút thuốc lá và nguy cơ ung thư vú", "C. Thu nhập cá nhân", "D. Số lượng anh chị em"], "c": 1, "e": "Estrogen trong thuốc tránh thai làm tăng yếu tố đông máu, đặc biệt nguy hiểm gây tắc mạch, đột quỵ ở phụ nữ trên 35 tuổi có hút thuốc."}, {"q": "Câu 71: Sự phát triển bất thường ở trẻ 18 tháng: Trẻ chưa biết đi, chưa nói được từ đơn nào có ý nghĩa, và không chỉ tay vào đồ vật mình muốn. Bác sĩ YHGĐ cần nghi ngờ và sàng lọc vấn đề gì đầu tiên?", "a": ["A. Trẻ bị suy dinh dưỡng", "B. Rối loạn phổ tự kỷ (ASD) và chậm phát triển tâm thần vận động toàn diện", "C. Trẻ bị viêm họng", "D. Rối loạn tiêu hóa"], "c": 1, "e": "Thiếu kỹ năng giao tiếp bằng mắt, không chỉ tay (joint attention) và chậm ngôn ngữ/vận động là cờ đỏ cảnh báo tự kỷ cần can thiệp sớm."}, {"q": "Câu 72: Tuổi sinh học (Biological age) và Tuổi thời gian (Chronological age) khác nhau như thế nào khi đánh giá một bệnh nhân cao tuổi?", "a": ["A. Cả hai luôn bằng nhau", "B. Tuổi thời gian tính bằng năm tháng sống; Tuổi sinh học phản ánh tình trạng thực tế của cơ quan, tế bào, có thể già hơn hoặc trẻ hơn tuổi thật tùy vào lối sống", "C. Tuổi sinh học là tuổi tính từ khi đẻ", "D. Tuổi thời gian tính bằng máy móc"], "c": 1, "e": "BSGĐ ra quyết định điều trị (như mổ tim) dựa vào Tuổi sinh học (thể trạng, mức độ suy yếu) chứ không chỉ nhìn vào con số trên CMND."}, {"q": "Câu 73: Trong chu trình vòng đời, khái niệm \"Lập trình thai nhi\" (Fetal programming) của giả thuyết Barker giải thích hiện tượng gì?", "a": ["A. Trẻ em học code từ trong bụng mẹ", "B. Suy dinh dưỡng hoặc stress ở mẹ trong thai kỳ gây ra những thay đổi biểu sinh vĩnh viễn ở bào thai, làm tăng nguy cơ mắc bệnh tim mạch, tiểu đường khi đứa trẻ này lớn lên thành người già", "C. Mẹ nghe nhạc Mozart giúp con thành thiên tài", "D. Việc lựa chọn giới tính thai nhi"], "c": 1, "e": "Trải nghiệm tiêu cực giai đoạn thai nhi (đầu vòng đời) sẽ thiết lập lại hệ gene, tác động trực tiếp đến sức khỏe ở giai đoạn cuối vòng đời."}, {"q": "Câu 74: Một bệnh nhân nam 50 tuổi đến khám vì rối loạn cương dương và giảm ham muốn tình dục, kèm theo mệt mỏi, tích mỡ bụng. Vấn đề này thuộc về sự kiện vòng đời nào ở nam giới?", "a": ["A. Lão hóa da", "B. Mãn dục nam (Andropause / Suy sinh dục khởi phát muộn), do sự suy giảm nồng độ Testosterone theo tuổi tác", "C. Dậy thì muộn", "D. Trầm cảm do công việc"], "c": 1, "e": "Dù không đột ngột như nữ giới, nam giới trung niên cũng trải qua sự sụt giảm nội tiết từ từ gây yếu sinh lý, loãng xương và mất cơ bắp."}, {"q": "Câu 75: Trong quản lý trẻ em vị thành niên, nguyên tắc \"Khám bệnh có không gian riêng tư, bảo mật\" (Confidentiality) nhằm mục đích gì đối với BSGĐ?", "a": ["A. Tránh bị phụ huynh phàn nàn", "B. Khuyến khích trẻ dám chia sẻ sự thật về các vấn đề nhạy cảm (hoạt động tình dục, có thai, bạo lực học đường, sử dụng ma túy) mà trẻ giấu cha mẹ", "C. Viết bệnh án nhanh hơn", "D. Tính thêm tiền khám"], "c": 1, "e": "Nếu có phụ huynh ngồi cạnh, trẻ teen sẽ tuyệt đối nói dối. BSGĐ cần không gian 1-1 để tiếp cận các góc khuất tâm lý của độ tuổi nổi loạn này."}, {"q": "Câu 76: Sự thay đổi dược động học do lão hóa: Tại sao người già dễ bị tác dụng phụ kéo dài (như ngủ ngật, sảng) khi dùng các thuốc an thần nhóm Benzodiazepine (như Diazepam)?", "a": ["A. Vì dạ dày hấp thu thuốc tốt hơn", "B. Vì thể tích mỡ tăng làm tăng tích lũy thuốc tan trong mỡ, kết hợp chức năng gan/thận giảm làm thời gian bán thải (T1/2) của thuốc kéo dài gấp nhiều lần", "C. Vì não người già nhạy cảm hơn với ánh sáng", "D. Vì họ uống quá nhiều nước"], "c": 1, "e": "Diazepam tan mạnh trong mỡ. Người già mỡ nhiều nên thuốc ngấm vào đó dự trữ, rỉ rả phóng thích ra máu khiến họ buồn ngủ triền miên."}, {"q": "Câu 77: Mô hình Chăm sóc theo vòng đời yêu cầu BSGĐ phải tiếp cận bệnh \"Béo phì ở trẻ em\" như thế nào?", "a": ["A. Chỉ yêu cầu trẻ nhịn ăn", "B. Không chỉ can thiệp vào đứa trẻ mà phải can thiệp vào hành vi mua sắm, nấu nướng và thói quen sinh hoạt của cả hệ thống gia đình", "C. Phẫu thuật cắt dạ dày", "D. Bắt trẻ uống thuốc giảm cân"], "c": 1, "e": "Đứa trẻ không tự đi mua đồ ăn. Thói quen gia đình (ăn thức ăn nhanh, ít thể thao) là nguyên nhân gốc rễ cần phải sửa chữa."}, {"q": "Câu 78: Sự phát triển tư duy ở trẻ 7-11 tuổi (Tuổi đi học) theo Piaget là chuyển từ tư duy nào sang tư duy nào?", "a": ["A. Từ tư duy cảm giác vận động sang trừu tượng", "B. Từ tư duy tiền thao tác (ảo tưởng, chỉ lấy mình làm trung tâm) sang tư duy thao tác cụ thể (logic hơn, hiểu luật lệ)", "C. Từ logic sang tưởng tượng", "D. Không phát triển tư duy"], "c": 1, "e": "Trẻ bắt đầu đi học có khả năng hiểu nhân-quả thực tế, tuân thủ kỷ luật lớp học và hiểu quan điểm của người khác."}, {"q": "Câu 79: Hiện tượng \"Trẻ hóa bệnh mạn tính\" trong cấu trúc vòng đời hiện nay ở Việt Nam có nghĩa là gì?", "a": ["A. Bệnh mạn tính làm người ta trẻ ra", "B. Trẻ sơ sinh bị tăng huyết áp", "C. Các bệnh lý trước đây chỉ gặp ở người già (tiểu đường tuýp 2, đột quỵ, nhồi máu cơ tim) nay xuất hiện ngày càng nhiều ở lứa tuổi thanh niên, trung niên do áp lực công việc và lối sống tĩnh tại", "D. Người trẻ không còn bị bệnh truyền nhiễm"], "c": 2, "e": "Vòng đời bệnh tật đang thay đổi tiêu cực. Chế độ ăn công nghiệp khiến thanh niên 30 tuổi đã bị mỡ máu cao và đột quỵ."}, {"q": "Câu 80: \"Advance Care Planning\" (Lập kế hoạch chăm sóc trước) là một nghiệp vụ của BSGĐ thường thực hiện với đối tượng nào trong vòng đời?", "a": ["A. Phụ nữ mang thai", "B. Thanh niên chuẩn bị đại học", "C. Người lớn tuổi có nhiều bệnh mạn tính đe dọa tính mạng, nhằm thảo luận trước về ý nguyện cuối đời (có đặt nội khí quản, hồi sức tim phổi không) phòng khi họ mất năng lực quyết định", "D. Trẻ em trước khi tiêm chủng"], "c": 2, "e": "Bàn bạc trước về cái chết giúp tránh những can thiệp y tế đau đớn, vô ích, đảm bảo sự tôn nghiêm cho người già khi họ nhắm mắt xuôi tay."}];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function initJumpSelect() {
            const select = document.getElementById('jump-select');
            quizData.forEach((_, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.text = `Chuyển đến Câu ${idx + 1}`;
                select.appendChild(opt);
            });
        }

        function jumpToQuestion() {
            const select = document.getElementById('jump-select');
            currentIdx = parseInt(select.value);
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('q-text').innerText = `Câu ${currentIdx + 1}: ${q.q.replace(/Câu \d+:\s*/, '')}`;
            document.getElementById('question-count').innerText = `Câu ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
            document.getElementById('jump-select').value = currentIdx;
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            
            const expBox = document.getElementById('explanation-box');
            expBox.style.display = 'none';
            expBox.innerHTML = '';
            
            answered = false;
            document.getElementById('next-btn').disabled = true;

            q.a.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(div, i);
                list.appendChild(div);
            });
        }

        function checkAnswer(el, idx) {
            if (answered) return;
            answered = true;
            const correctIdx = quizData[currentIdx].c;
            
            if (idx === correctIdx) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
                const options = document.querySelectorAll('.option');
                if(options[correctIdx]) {
                    options[correctIdx].classList.add('correct');
                }
            }
            
            // Hiển thị phần giải thích
            const expText = quizData[currentIdx].e;
            if (expText && expText.trim() !== "") {
                const expBox = document.getElementById('explanation-box');
                expBox.innerHTML = `💡 <b>Giải thích:</b><br>${expText}`;
                expBox.style.display = 'block';
            }
            
            document.getElementById('score-display').innerText = `Đúng: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.style.display = 'block';
            document.getElementById('final-result').innerText = `${score}/${quizData.length}`;
            
            const percent = (score / quizData.length) * 100;
            let msg = "";
            if (percent >= 90) msg = "Quá xuất sắc! Bạn là bậc thầy YHGĐ.";
            else if (percent >= 70) msg = "Rất tốt! Bạn nắm kiến thức YHGĐ rất vững.";
            else if (percent >= 50) msg = "Tạm ổn, hãy ôn kỹ hơn các phần bị sai nhé.";
            else msg = "Bạn cần cố gắng nhiều hơn để vượt qua môn này.";
            document.getElementById('feedback').innerText = msg;
        }

        if(quizData.length > 0) {
            initJumpSelect();
            loadQuestion();
        } else {
            document.getElementById('q-text').innerText = "Không tìm thấy câu hỏi nào.";
        }
    </script>

</html>
